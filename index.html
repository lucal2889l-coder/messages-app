<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages</title>
<style>
  :root{
    --blue:#0b84ff;
    --blue-dark:#0066e0;
    --bg:#ffffff;
    --sidebar-bg:#f6f6f7;
    --border:#e2e2e4;
    --text:#1c1c1e;
    --text-dim:#8a8a8e;
    --bubble-in:#e9e9eb;
    --bubble-in-text:#1c1c1e;
    --danger:#ff3b30;
    --warn:#ff9500;
    --ok:#34c759;
    --radius-bubble:18px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;
    color:var(--text);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  #app{
    display:flex;
    height:100vh;
    width:100%;
    overflow:hidden;
    background:var(--bg);
    border:1px solid var(--border);
  }

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:300px;
    min-width:220px;
    max-width:340px;
    background:var(--sidebar-bg);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    flex-shrink:0;
  }
  #sidebar-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 16px 10px 16px;
  }
  #sidebar-header-title{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
  }
  #sidebar-header h1{
    font-size:20px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.2px;
  }
  #conn-dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--danger);
    flex-shrink:0;
    transition:background-color .25s ease;
    box-shadow:0 0 0 3px rgba(0,0,0,0.04);
  }
  #conn-dot.conn-connecting{background:var(--warn);}
  #conn-dot.conn-connected{background:var(--ok);}
  #conn-dot.conn-disconnected{background:var(--danger);}
  #compose-btn{
    width:30px;height:30px;border-radius:50%;
    border:none;background:var(--blue);color:#fff;
    font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  #compose-btn:hover{background:var(--blue-dark);}
  #settings-btn{
    width:30px;height:30px;border-radius:50%;
    border:none;background:#e5e5e7;color:var(--text);
    font-size:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  #settings-btn:hover{background:#d8d8da;}
  #search-wrap{padding:0 12px 10px 12px;}
  #search-input{
    width:100%;
    padding:7px 12px;
    border-radius:10px;
    border:none;
    background:#e5e5e7;
    font-size:14px;
    outline:none;
  }
  #chat-list{
    flex:1;
    overflow-y:auto;
    padding:4px 8px;
  }
  .chat-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 8px;
    border-radius:10px;
    cursor:pointer;
    margin-bottom:2px;
  }
  .chat-row:hover{background:#eaeaec;}
  .chat-row.active{background:var(--blue);}
  .chat-row.active .chat-title{color:#fff;}
  .chat-row.active .chat-preview{color:#dcebff;}
  .chat-row.active .chat-time{color:#dcebff;}
  .avatar{
    width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:600;font-size:15px;
    flex-shrink:0;
  }
  .chat-row-main{flex:1;min-width:0;}
  .chat-row-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;}
  .chat-title{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px;}
  .chat-time{font-size:12px;color:var(--text-dim);flex-shrink:0;}
  .chat-preview{font-size:13px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
  .lock-icon{flex-shrink:0;opacity:0.7;}
  #empty-sidebar{
    padding:40px 20px;text-align:center;color:var(--text-dim);font-size:13.5px;line-height:1.5;
  }

  /* ---------- Main / conversation ---------- */
  #main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
    position:relative;
  }
  #conv-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 16px;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  #back-btn{
    display:none;
    border:none;background:none;color:var(--blue);
    font-size:15px;cursor:pointer;padding:4px 6px 4px 0;
    flex-shrink:0;
  }
  #conv-header .avatar{width:32px;height:32px;font-size:13px;}
  #conv-title-wrap{flex:1;min-width:0;}
  #conv-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #conv-sub{font-size:12px;color:var(--text-dim);}
  #info-btn{
    border:none;background:none;color:var(--blue);
    font-size:20px;cursor:pointer;padding:2px 6px;
    flex-shrink:0;
  }
  #messages-scroll{
    flex:1;
    overflow-y:auto;
    padding:16px 16px 8px 16px;
    display:flex;
    flex-direction:column;
  }
  .msg-row{display:flex;margin-bottom:4px;align-items:flex-end;}
  .msg-row.me{justify-content:flex-end;}
  .msg-row.them{justify-content:flex-start;}
  /* Bubble sizing: max-width lives on this wrapper (whose own width is
     always definite, since msg-row is stretched full-width by its
     column-flex parent). The bubble itself is width:fit-content so it
     hugs the actual message length instead of forcing an artificially
     narrow box that breaks words mid-word. */
  .bubble-group{
    display:flex;
    flex-direction:column;
    max-width:62%;
    min-width:0;
  }
  .msg-row.me .bubble-group{align-items:flex-end;}
  .msg-row.them .bubble-group{align-items:flex-start;}
  .bubble{
    width:fit-content;
    max-width:100%;
    padding:8px 14px;
    border-radius:var(--radius-bubble);
    font-size:14.5px;
    line-height:1.35;
    word-wrap:break-word;
    overflow-wrap:break-word;
    white-space:pre-wrap;
  }
  .msg-row.me .bubble{background:var(--blue);color:#fff;border-bottom-right-radius:5px;}
  .msg-row.them .bubble{background:var(--bubble-in);color:var(--bubble-in-text);border-bottom-left-radius:5px;}
  .msg-meta{font-size:11px;color:var(--text-dim);text-align:center;margin:12px 0 6px 0;}
  .sender-label{font-size:11.5px;color:var(--text-dim);margin:2px 12px 2px 2px;}
  .msg-avatar{
    width:28px;height:28px;border-radius:50%;
    overflow:hidden;flex-shrink:0;margin-right:6px;
  }
  .msg-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .typing-bubble{display:flex;align-items:center;gap:4px;padding:11px 14px;}
  .typing-dot{
    width:6px;height:6px;border-radius:50%;
    background:#9a9a9e;display:inline-block;
    animation:typing-bounce 1.2s infinite ease-in-out;
  }
  .typing-dot:nth-child(2){animation-delay:0.15s;}
  .typing-dot:nth-child(3){animation-delay:0.3s;}
  @keyframes typing-bounce{
    0%,60%,100%{transform:translateY(0);opacity:0.5;}
    30%{transform:translateY(-4px);opacity:1;}
  }
  #composer{
    display:flex;
    align-items:flex-end;
    gap:8px;
    padding:10px 14px 14px 14px;
    border-top:1px solid var(--border);
    flex-shrink:0;
  }
  #msg-input{
    flex:1;
    border:1px solid #d5d5d7;
    border-radius:18px;
    padding:8px 14px;
    font-size:14.5px;
    resize:none;
    max-height:120px;
    outline:none;
    font-family:inherit;
    line-height:1.35;
  }
  #msg-input:focus{border-color:var(--blue);}
  #send-btn{
    width:32px;height:32px;border-radius:50%;
    border:none;background:var(--blue);color:#fff;
    font-size:15px;cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  #send-btn:disabled{background:#c7c7c9;cursor:default;}

  #no-chat-selected{
    flex:1;display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);font-size:14px;text-align:center;flex-direction:column;gap:10px;
  }
  #no-chat-selected .big-icon{font-size:40px;opacity:0.5;}

  /* ---------- Modal / overlay ---------- */
  .overlay{
    position:absolute;inset:0;
    background:rgba(0,0,0,0.28);
    display:flex;align-items:center;justify-content:center;
    z-index:50;
  }
  .modal{
    background:#fff;border-radius:14px;
    width:320px;max-width:90%;
    padding:20px;
    box-shadow:0 10px 40px rgba(0,0,0,0.2);
  }
  .modal h2{margin:0 0 14px 0;font-size:16px;font-weight:700;}
  .field-label{font-size:12.5px;color:var(--text-dim);margin:10px 0 4px 0;font-weight:500;}
  .field-input{
    width:100%;padding:8px 10px;border-radius:8px;
    border:1px solid #d5d5d7;font-size:14px;outline:none;font-family:inherit;
  }
  .field-input:focus{border-color:var(--blue);}
  .checkbox-row{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13.5px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .btn{
    border:none;border-radius:8px;padding:7px 14px;font-size:14px;cursor:pointer;font-weight:500;
  }
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:disabled{background:#c7c7c9;cursor:default;}
  .btn-secondary{background:#efeff0;color:var(--text);}
  .btn-danger{background:var(--danger);color:#fff;}
  .error-text{color:var(--danger);font-size:12.5px;margin-top:8px;min-height:14px;}
  .lock-big{font-size:30px;text-align:center;margin-bottom:4px;}
  .subtle-note{font-size:12px;color:var(--text-dim);margin-top:10px;line-height:1.4;}

  /* Info panel */
  #info-panel{
    position:absolute;top:0;right:0;bottom:0;
    width:280px;max-width:80%;
    background:#fff;border-left:1px solid var(--border);
    box-shadow:-6px 0 24px rgba(0,0,0,0.08);
    display:flex;flex-direction:column;
    z-index:40;
    transform:translateX(0);
  }
  #info-panel-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;border-bottom:1px solid var(--border);
  }
  #info-panel-header h3{margin:0;font-size:15px;}
  #info-panel-close{border:none;background:none;font-size:15px;color:var(--blue);cursor:pointer;}
  #info-panel-body{padding:16px;overflow-y:auto;flex:1;}

  /* Toast */
  #toast{
    position:fixed;left:50%;bottom:24px;
    transform:translate(-50%, 12px);
    background:#1c1c1e;color:#fff;
    padding:10px 16px;border-radius:10px;
    font-size:13px;line-height:1.4;
    opacity:0;pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:100;max-width:80%;text-align:center;
    box-shadow:0 6px 20px rgba(0,0,0,0.2);
  }
  #toast.show{opacity:1;transform:translate(-50%, 0);pointer-events:auto;}

  @media (max-width:680px){
    #sidebar{
      width:100%;max-width:none;
      position:absolute;inset:0;z-index:5;
    }
    #sidebar.hidden{display:none;}
    #main.hidden{display:none;}
    #back-btn{display:inline-block;}
    #app{border:none;}
    .bubble-group{max-width:78%;}
  }
</style>
</head>
<body>
<div id="app">

  <div id="sidebar">
    <div id="sidebar-header">
      <div id="sidebar-header-title">
        <h1>Messages</h1>
        <span id="conn-dot" class="conn-disconnected" title="Disconnected"></span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button id="settings-btn" title="Settings">⚙</button>
        <button id="compose-btn" title="New chat">✎</button>
      </div>
    </div>
    <div id="search-wrap">
      <input id="search-input" type="text" placeholder="Search">
    </div>
    <div id="chat-list"></div>
  </div>

  <div id="main">
    <div id="no-chat-selected">
      <div class="big-icon">💬</div>
      <div>Select a chat, or start a new one.</div>
    </div>

    <div id="conv-header" style="display:none;">
      <button id="back-btn">‹ Back</button>
      <div class="avatar" id="conv-avatar"></div>
      <div id="conv-title-wrap">
        <div id="conv-title"></div>
        <div id="conv-sub"></div>
      </div>
      <button id="info-btn" title="Chat info">ⓘ</button>
    </div>

    <div id="messages-scroll" style="display:none;"></div>

    <div id="composer" style="display:none;">
      <textarea id="msg-input" rows="1" placeholder="iMessage"></textarea>
      <button id="send-btn">↑</button>
    </div>

    <div id="info-panel" style="display:none;"></div>
  </div>

</div>

<div id="modal-root"></div>

<script>
(function(){

  // ---------------- Storage ----------------
  // Private profile data stays in this browser.
  // Shared chats/messages live on the Render server. This page is hosted
  // statically on GitHub Pages, so it talks to that server over its full
  // URL (both plain HTTPS calls and a WebSocket), not relative paths.
  const SERVER_ORIGIN = 'https://messages-server-waf1.onrender.com';
  const API_BASE = SERVER_ORIGIN + '/api/data/';
  const WS_URL = SERVER_ORIGIN.replace(/^http/, 'ws') + '/ws';

  const privateStorage = {
    async get(key){
      const raw = localStorage.getItem(key);
      if(raw === null) throw new Error('key not found');
      return {key, value: raw, shared:false};
    },
    async set(key, value){
      localStorage.setItem(key, value);
      return {key, value, shared:false};
    },
    async delete(key){
      localStorage.removeItem(key);
      return {key, deleted:true, shared:false};
    }
  };

  async function serverGet(key){
    const res = await fetch(API_BASE + encodeURIComponent(key));
    if(res.status === 404) throw new Error('key not found');
    if(!res.ok) throw new Error('server read failed');
    const data = await res.json();
    return {key, value: JSON.stringify(data.value), shared:true};
  }

  async function serverSet(key, value){
    const res = await fetch(API_BASE + encodeURIComponent(key), {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({value: JSON.parse(value)})
    });
    if(!res.ok) throw new Error('server write failed');
    const data = await res.json();
    return {key, value: JSON.stringify(data.value), shared:true};
  }

  async function storageGet(key, shared){
    return shared ? serverGet(key) : privateStorage.get(key);
  }

  async function storageSet(key, value, shared){
    return shared ? serverSet(key, value) : privateStorage.set(key, value);
  }

  async function storageDelete(key, shared){
    if(shared){
      const res = await fetch(API_BASE + encodeURIComponent(key), {method:'DELETE'});
      if(!res.ok && res.status !== 404) throw new Error('server delete failed');
      return {key, deleted:true, shared:true};
    }
    return privateStorage.delete(key);
  }

  async function getData(key, shared, fallback){
    try{
      const res = await storageGet(key, shared);
      return res ? JSON.parse(res.value) : fallback;
    }catch(e){
      return fallback;
    }
  }

  async function getDataOrKeep(key, shared){
    try{
      const res = await storageGet(key, shared);
      return {changed:true, value: res ? JSON.parse(res.value) : []};
    }catch(e){
      return {changed:false};
    }
  }

  async function setData(key, value, shared){
    try{
      await storageSet(key, JSON.stringify(value), shared);
      return true;
    }catch(e){
      console.error('storage set failed', key, e);
      return false;
    }
  }

  function genId(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  }

  async function hashPassword(pw){
    try{
      const enc = new TextEncoder().encode(pw);
      const buf = await crypto.subtle.digest('SHA-256', enc);
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }catch(e){
      // fallback simple hash if subtlecrypto unavailable
      let h = 0;
      for(let i=0;i<pw.length;i++){ h = ((h<<5)-h+pw.charCodeAt(i))|0; }
      return 'fb'+h;
    }
  }

  // ---------------- Toast ----------------
  // A small transient message shown for non-fatal save/sync issues.
  function showToast(msg){
    let el = document.getElementById('toast');
    if(!el){
      el = document.createElement('div');
      el.id = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> el.classList.remove('show'), 3500);
  }

  // ---------------- App state ----------------
  const state = {
    profile: null,          // {id, name}
    chats: [],               // array of chat objects
    currentChatId: null,
    unlockedChatIds: new Set(), // session-only
    messagesCache: {},       // chatId -> array of messages
    profilesCache: {},       // senderId -> {id, name, avatar} | null
    searchTerm: ''
  };

  const AVATAR_COLORS = ['#ff9500','#ff3b30','#af52de','#5856d6','#007aff','#34c759','#ff2d55','#5ac8fa','#ffcc00'];
  function colorForName(name){
    let h=0;
    for(let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }
  function initialsForName(name){
    const parts = name.trim().split(/\s+/).filter(Boolean);
    if(parts.length===0) return '?';
    if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0]+parts[1][0]).toUpperCase();
  }

  // Only ever render an avatar image if it's actually a well-formed
  // image data URL — profiles are shared/writable by anyone with the
  // server URL, so this avoids ever turning a crafted value into markup.
  function isSafeAvatarDataUrl(url){
    return typeof url === 'string'
      && url.length < 200000
      && /^data:image\/(png|jpe?g|gif|webp);base64,[A-Za-z0-9+/=]+$/.test(url);
  }

  function avatarHtml(profile, fallbackName){
    if(profile && isSafeAvatarDataUrl(profile.avatar)){
      return `<img src="${profile.avatar}" alt="">`;
    }
    const name = (profile && profile.name) || fallbackName || '?';
    return `<div class="avatar" style="width:100%;height:100%;font-size:12px;background:${colorForName(name)};">${initialsForName(name)}</div>`;
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.innerText = str;
    return d.innerHTML;
  }

  function fmtTime(ts){
    const d = new Date(ts);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    if(sameDay) return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
    const oneWeek = 6*24*60*60*1000;
    if(now - d < oneWeek) return d.toLocaleDateString([], {weekday:'short'});
    return d.toLocaleDateString([], {month:'short', day:'numeric'});
  }

  // ---------------- Modal system ----------------
  const modalRoot = document.getElementById('modal-root');
  function closeModal(){ modalRoot.innerHTML = ''; }
  function openModal(html){ modalRoot.innerHTML = '<div class="overlay" id="active-overlay">'+html+'</div>'; }

  // ---------------- Name onboarding ----------------
  function showNamePrompt(){
    openModal(`
      <div class="modal">
        <h2>What should we call you?</h2>
        <input id="name-input" class="field-input" type="text" placeholder="Your name" maxlength="30" autofocus>
        <div class="error-text" id="name-error"></div>
        <div class="modal-actions">
          <button class="btn btn-primary" id="name-save-btn">Continue</button>
        </div>
      </div>
    `);
    const input = document.getElementById('name-input');
    input.focus();
    const save = async ()=>{
      const name = input.value.trim();
      if(!name){ document.getElementById('name-error').textContent = 'Please enter a name.'; return; }
      const profile = {id: genId(), name, avatar: null};
      await setData('profile', profile, false);
      state.profile = profile;
      pushProfileToServer(profile);
      closeModal();
      init();
    };
    document.getElementById('name-save-btn').onclick = save;
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') save(); });
  }

  // ---------------- New chat modal ----------------
  function showNewChatModal(){
    openModal(`
      <div class="modal">
        <h2>New Chat</h2>
        <div class="field-label">Chat name</div>
        <input id="new-chat-title" class="field-input" type="text" placeholder="e.g. Weekend Trip" maxlength="40" autofocus>
        <div class="checkbox-row">
          <input type="checkbox" id="new-chat-locked">
          <label for="new-chat-locked">Lock this chat with a password</label>
        </div>
        <div id="new-chat-pw-fields" style="display:none;">
          <div class="field-label">Password</div>
          <input id="new-chat-pw" class="field-input" type="password" maxlength="60">
          <div class="field-label">Confirm password</div>
          <input id="new-chat-pw2" class="field-input" type="password" maxlength="60">
        </div>
        <div class="error-text" id="new-chat-error"></div>
        <div class="modal-actions">
          <button class="btn btn-secondary" id="new-chat-cancel">Cancel</button>
          <button class="btn btn-primary" id="new-chat-create">Create</button>
        </div>
      </div>
    `);
    const lockedBox = document.getElementById('new-chat-locked');
    const pwFields = document.getElementById('new-chat-pw-fields');
    lockedBox.onchange = ()=>{ pwFields.style.display = lockedBox.checked ? 'block' : 'none'; };
    document.getElementById('new-chat-cancel').onclick = closeModal;
    document.getElementById('new-chat-title').focus();

    document.getElementById('new-chat-create').onclick = async ()=>{
      const errEl = document.getElementById('new-chat-error');
      const title = document.getElementById('new-chat-title').value.trim();
      if(!title){ errEl.textContent = 'Please give the chat a name.'; return; }
      let locked = lockedBox.checked;
      let passwordHash = null;
      if(locked){
        const pw = document.getElementById('new-chat-pw').value;
        const pw2 = document.getElementById('new-chat-pw2').value;
        if(pw.length < 4){ errEl.textContent = 'Password must be at least 4 characters.'; return; }
        if(pw !== pw2){ errEl.textContent = 'Passwords do not match.'; return; }
        passwordHash = await hashPassword(pw);
      }
      const chat = {
        id: genId(),
        title,
        locked,
        passwordHash,
        createdAt: Date.now(),
        lastMessageAt: Date.now(),
        lastMessage: '',
        lastSenderName: '',
        lastSenderId: null
      };
      // Read the freshest chat list before writing, falling back to our
      // current in-memory list (never to an empty array) if that read fails.
      const fresh = await getDataOrKeep('chats', true);
      const baseChats = fresh.changed ? fresh.value : state.chats;
      baseChats.unshift(chat);
      state.chats = baseChats;
      const ok = await setData('chats', state.chats, true);
      await setData('messages:'+chat.id, [], true);
      state.unlockedChatIds.add(chat.id); // creator starts unlocked
      closeModal();
      renderChatList();
      selectChat(chat.id);
      if(!ok) showToast("Chat created, but couldn't confirm it saved — check your connection.");
    };
  }

  // ---------------- Password prompt (for locked chats) ----------------
  function showPasswordPrompt(chat, onSuccess){
    openModal(`
      <div class="modal">
        <div class="lock-big">🔒</div>
        <h2 style="text-align:center;">${escapeHtml(chat.title)}</h2>
        <div class="field-label">This chat is locked. Enter the password to open it.</div>
        <input id="unlock-pw" class="field-input" type="password" autofocus>
        <div class="error-text" id="unlock-error"></div>
        <div class="modal-actions">
          <button class="btn btn-secondary" id="unlock-cancel">Cancel</button>

        </div>

    `);
    const input = document.getElementById('unlock-pw');
    input.focus();
    document.getElementById('unlock-cancel').onclick = closeModal;
    const attempt = async ()=>{

  // ---------------- Settings / profile (name + photo) ----------------
  // Reads a chosen image file and downsizes it to a small square-ish
  // JPEG data URL, so profile photos stay lightweight wherever they're
  // stored and sent.
  function readAndResizeImage(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onerror = ()=> reject(new Error('read failed'));
      reader.onload = ()=>{
        const img = new Image();
        img.onerror = ()=> reject(new Error('decode failed'));
        img.onload = ()=>{
          const maxDim = 160;
          let width = img.naturalWidth, height = img.naturalHeight;
          if(width > height){
            if(width > maxDim){ height = Math.round(height * (maxDim/width)); width = maxDim; }
          }else{
            if(height > maxDim){ width = Math.round(width * (maxDim/height)); height = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.82));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // The profile is written to localStorage (the durable, private copy)
  // AND to the shared server store under profiles:<id>, so other open
  // browsers can show your name/photo. If the server's storage ever
  // gets wiped (a Render redeploy/restart), this browser is still the
  // source of truth, so ensureProfileSynced() below quietly resends it.
  async function pushProfileToServer(profile){
    if(!profile) return false;
    return setData('profiles:'+profile.id, profile, true);
  }

  async function ensureProfileSynced(){
    if(!state.profile) return;
    const res = await getDataOrKeep('profiles:'+state.profile.id, true);
    if(!res.changed) return; // offline/failed read — don't guess, try again later
    const serverCopy = res.value;
    const matches = serverCopy
      && serverCopy.name === state.profile.name
      && serverCopy.avatar === state.profile.avatar;
    if(!matches){
      await pushProfileToServer(state.profile);
    }
  }

          <div>
            <button class="btn btn-secondary" type="button" id="settings-upload-btn">Upload photo</button>

        </div>
      </div>
    `);

    let pendingAvatar = isSafeAvatarDataUrl(currentAvatar) ? currentAvatar : null;
    let avatarRemoved = false;

    const preview = document.getElementById('settings-avatar-preview');
    const removeWrap = document.getElementById('settings-remove-wrap');
    const nameInput = document.getElementById('settings-name-input');

    function updatePreview(){
      const name = nameInput.value.trim() || '?';
      preview.style.background = colorForName(name);
      if(pendingAvatar){
        preview.innerHTML = `<img src="${pendingAvatar}" alt="" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
        removeWrap.style.display = '';

    document.getElementById('settings-upload-btn').onclick = ()=> document.getElementById('settings-file-input').click();
    document.getElementById('settings-file-input').addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const errEl = document.getElementById('settings-error');
      errEl.textContent = '';
      try{
        pendingAvatar = await readAndResizeImage(file);
        avatarRemoved = false;
        updatePreview();
      }catch(err){
        errEl.textContent = "Couldn't read that image — try a different file.";
      }
    });
    document.getElementById('settings-remove-btn').onclick = ()=>{

      updatePreview();

    nameInput.addEventListener('input', updatePreview);
    document.getElementById('settings-cancel').onclick = closeModal;
    nameInput.focus();

    document.getElementById('settings-save').onclick = async ()=>{
      const errEl = document.getElementById('settings-error');
      const name = nameInput.value.trim();
      if(!name){ errEl.textContent = 'Please enter a name.'; return; }
      const profile = {
        id: state.profile.id,
        name,
        avatar: avatarRemoved ? null : (pendingAvatar || null)
      };
      state.profile = profile;
      await setData('profile', profile, false);
      const ok = await pushProfileToServer(profile);
      closeModal();
      renderChatList();
      if(state.currentChatId) renderMessages(state.currentChatId);
      if(!ok) showToast("Saved on this device — it'll resend to the server automatically once it's reachable.");

  function showDeleteConfirm(chat){
    openModal(`
      <div class="modal">
        <h2>Delete "${escapeHtml(chat.title)}"?</h2>
        <div class="field-label" style="margin-top:0;">This removes the chat and its messages for everyone. This can't be undone.</div>
        <div class="modal-actions">
          <button class="btn btn-secondary" id="del-cancel">Cancel</button>
          <button class="btn btn-danger" id="del-confirm">Delete</button>
        </div>
      </div>
    `);
    document.getElementById('del-cancel').onclick = closeModal;
    document.getElementById('del-confirm').onclick = async ()=>{
      state.chats = state.chats.filter(c=>c.id!==chat.id);

  // ---------------- Rendering: sidebar ----------------
  function renderChatList(){
    const list = document.getElementById('chat-list');
    let chats = state.chats.slice().sort((a,b)=>b.lastMessageAt - a.lastMessageAt);
    if(state.searchTerm){
      const q = state.searchTerm.toLowerCase();
      chats = chats.filter(c=>c.title.toLowerCase().includes(q));
    }
    if(chats.length===0){
      list.innerHTML = '<div id="empty-sidebar">No chats yet.<br>Tap ✎ to start one.</div>';
      return;
    }
    list.innerHTML = chats.map(c=>{
      const unlocked = !c.locked || state.unlockedChatIds.has(c.id);
      let previewName = c.lastSenderName;
      if(state.profile && c.lastSenderId === state.profile.id) previewName = 'You';
      const preview = c.locked && !unlocked ? 'Locked chat' : (c.lastMessage ? (previewName ? escapeHtml(previewName)+': '+escapeHtml(c.lastMessage) : escapeHtml(c.lastMessage)) : 'No messages yet');
      const active = c.id === state.currentChatId ? 'active' : '';
      return `
        <div class="chat-row ${active}" data-id="${c.id}">
          <div class="avatar" style="background:${colorForName(c.title)}">${initialsForName(c.title)}</div>
          <div class="chat-row-main">
            <div class="chat-row-top">
              <div class="chat-title">${c.locked ? '<span class="lock-icon">🔒</span>' : ''}${escapeHtml(c.title)}</div>
              <div class="chat-time">${fmtTime(c.lastMessageAt)}</div>
            </div>
            <div class="chat-preview">${preview}</div>
          </div>
        </div>
      `;
    }).join('');
    list.querySelectorAll('.chat-row').forEach(row=>{
      row.onclick = ()=> selectChat(row.getAttribute('data-id'));
    });

  // ---------------- Rendering: conversation ----------------
  function showNoChatSelected(){
    document.getElementById('no-chat-selected').style.display = 'flex';
    document.getElementById('conv-header').style.display = 'none';
    document.getElementById('messages-scroll').style.display = 'none';
    document.getElementById('composer').style.display = 'none';
    document.getElementById('info-panel').style.display = 'none';
  }

  async function selectChat(chatId){
    const chat = state.chats.find(c=>c.id===chatId);
    if(!chat) return;
    if(chat.locked && !state.unlockedChatIds.has(chat.id)){
      showPasswordPrompt(chat, ()=> openChat(chatId));
      return;
    }
    openChat(chatId);
  }

  async function openChat(chatId){
    clearTypingUsers();
    state.currentChatId = chatId;
    document.getElementById('info-panel').style.display = 'none';
    if(window.innerWidth <= 680){
      document.getElementById('sidebar').classList.add('hidden');
      document.getElementById('main').classList.remove('hidden');
    }
    renderChatList();
    renderConvHeader();
    document.getElementById('no-chat-selected').style.display = 'none';
    document.getElementById('conv-header').style.display = 'flex';
    document.getElementById('messages-scroll').style.display = 'flex';
    document.getElementById('composer').style.display = 'flex';
    await refreshMessages(chatId, true);
    document.getElementById('msg-input').focus();
  }

  function renderConvHeader(){
    const chat = state.chats.find(c=>c.id===state.currentChatId);
    if(!chat) return;
    document.getElementById('conv-avatar').style.background = colorForName(chat.title);
    document.getElementById('conv-avatar').textContent = initialsForName(chat.title);
    document.getElementById('conv-title').innerHTML = (chat.locked ? '🔒 ' : '') + escapeHtml(chat.title);
    document.getElementById('conv-sub').textContent = '';
  }

  function renderMessages(chatId){
    const el = document.getElementById('messages-scroll');
    const msgs = state.messagesCache[chatId] || [];
    const wasNearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
    let lastDay = null;
    let html = '';
    const missingProfiles = new Set();
    msgs.forEach(m=>{
      const day = new Date(m.ts).toDateString();
      if(day !== lastDay){
        html += `<div class="msg-meta">${new Date(m.ts).toLocaleDateString([], {weekday:'long', month:'short', day:'numeric'})}</div>`;
        lastDay = day;
      }
      const mine = m.senderId === state.profile.id;
      html += `<div class="msg-row ${mine?'me':'them'}">`;
      if(!mine){
        const prof = state.profilesCache[m.senderId];
        if(prof === undefined) missingProfiles.add(m.senderId);
        html += `<div class="msg-avatar">${avatarHtml(prof, m.senderName)}</div>`;
      }
      html += `<div class="bubble-group">`;
      if(!mine) html += `<div class="sender-label">${escapeHtml(m.senderName)}</div>`;
      html += `<div class="bubble">${escapeHtml(m.text)}</div>`;
      html += `</div></div>`;
    });
    el.innerHTML = html || '';
    renderTypingBubble();
    if(wasNearBottom){ el.scrollTop = el.scrollHeight; }
    // Progressively fetch any sender profiles (for their avatar) we
    // haven't seen yet, then re-render once — never blocks the initial
    // paint, which already falls back to colored initials.
    if(missingProfiles.size){
      Promise.all(Array.from(missingProfiles).map(async uid=>{
        const p = await getData('profiles:'+uid, true, null);
        state.profilesCache[uid] = p;
      })).then(()=>{
        if(chatId === state.currentChatId) renderMessages(chatId);
      });
    }
  }

  async function refreshMessages(chatId, forceScroll){
    const msgs = await getData('messages:'+chatId, true, []);
    state.messagesCache[chatId] = msgs;
    if(chatId === state.currentChatId){
      renderMessages(chatId);
      if(forceScroll){
        const el = document.getElementById('messages-scroll');
        el.scrollTop = el.scrollHeight;
      }
    }
  }

  // ---------------- Sending messages ----------------
  async function sendMessage(){
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if(!text || !state.currentChatId) return;
    const chatId = state.currentChatId;
    input.value = '';
    autosizeInput(input);
    updateSendBtn();

    // Read the freshest message list, falling back to our own cache
    // (never to an empty array) if that read fails — otherwise a
    // transient read error here would wipe the whole conversation.
    const fresh = await getDataOrKeep('messages:'+chatId, true);
    const msgs = fresh.changed ? fresh.value : (state.messagesCache[chatId] || []).slice();
    const msg = {
      id: genId(),
      senderId: state.profile.id,
      senderName: state.profile.name,
      text,
      ts: Date.now()
    };
    msgs.push(msg);
    const saved = await setData('messages:'+chatId, msgs, true);
    state.messagesCache[chatId] = msgs;
    renderMessages(chatId);
    const el = document.getElementById('messages-scroll');
    el.scrollTop = el.scrollHeight;
    if(!saved) showToast("Message may not have saved — check your connection.");

    // update chat metadata, same safe-fallback pattern
    const freshChats = await getDataOrKeep('chats', true);
    const chats = freshChats.changed ? freshChats.value : state.chats;
    const idx = chats.findIndex(c=>c.id===chatId);
    if(idx>-1){
      chats[idx].lastMessage = text;
      chats[idx].lastSenderName = msg.senderName;
      chats[idx].lastSenderId = msg.senderId;
      chats[idx].lastMessageAt = msg.ts;
      state.chats = chats;
      await setData('chats', chats, true);
      renderChatList();
    }
  }

  function autosizeInput(input){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  }
  function updateSendBtn(){
    const input = document.getElementById('msg-input');
    document.getElementById('send-btn').disabled = input.value.trim().length===0;
  }

  // ---------------- Info panel ----------------
  function toggleInfoPanel(){
    const panel = document.getElementById('info-panel');
    const isOpen = panel.style.display === 'flex';
    if(isOpen){ panel.style.display = 'none'; return; }
    renderInfoPanel();
    panel.style.display = 'flex';
  }

  function renderInfoPanel(){
    const chat = state.chats.find(c=>c.id===state.currentChatId);
    if(!chat) return;
    const panel = document.getElementById('info-panel');
    panel.style.flexDirection = 'column';
    panel.innerHTML = `
      <div id="info-panel-header">
        <h3>Chat Info</h3>
        <button id="info-panel-close">Done</button>
      </div>
      <div id="info-panel-body">
        <div class="field-label">Chat name</div>
        <input id="info-title" class="field-input" type="text" value="${escapeHtml(chat.title)}" maxlength="40">
        <div class="checkbox-row">
          <input type="checkbox" id="info-locked" ${chat.locked?'checked':''}>
          <label for="info-locked">Lock this chat with a password</label>
        </div>
        <div id="info-pw-fields" style="display:none;">
          <div class="field-label">New password</div>
          <input id="info-pw" class="field-input" type="password" maxlength="60">
          <div class="field-label">Confirm password</div>
          <input id="info-pw2" class="field-input" type="password" maxlength="60">
        </div>
        <div class="error-text" id="info-error"></div>
        <div class="modal-actions" style="justify-content:flex-start;">
          <button class="btn btn-primary" id="info-save">Save changes</button>
        </div>
        <div style="height:1px;background:var(--border);margin:18px 0;"></div>
        <button class="btn btn-danger" id="info-delete" style="width:100%;">Delete Chat</button>
        <div class="subtle-note">Passwords lock the chat behind a prompt in this app, but this isn't real encryption — treat it as a privacy convenience, not a secure vault.</div>
      </div>
    `;
    document.getElementById('info-panel-close').onclick = toggleInfoPanel;
    const lockedBox = document.getElementById('info-locked');
    const pwFields = document.getElementById('info-pw-fields');
    // if turning lock ON (from off), need new password
    lockedBox.onchange = ()=>{
      pwFields.style.display = (lockedBox.checked && !chat.locked) ? 'block' : 'none';
    };
    document.getElementById('info-delete').onclick = ()=> showDeleteConfirm(chat);

    document.getElementById('info-save').onclick = async ()=>{
      const errEl = document.getElementById('info-error');
      const newTitle = document.getElementById('info-title').value.trim();
      if(!newTitle){ errEl.textContent = 'Chat name cannot be empty.'; return; }
      let newLocked = lockedBox.checked;
      let newHash = chat.passwordHash;
      if(newLocked && !chat.locked){
        const pw = document.getElementById('info-pw').value;
        const pw2 = document.getElementById('info-pw2').value;
        if(pw.length < 4){ errEl.textContent = 'Password must be at least 4 characters.'; return; }
        if(pw !== pw2){ errEl.textContent = 'Passwords do not match.'; return; }
        newHash = await hashPassword(pw);
        state.unlockedChatIds.add(chat.id);
      }
      if(!newLocked){ newHash = null; }
      chat.title = newTitle;
      chat.locked = newLocked;
      chat.passwordHash = newHash;
      const fresh = await getDataOrKeep('chats', true);
      const baseChats = fresh.changed ? fresh.value : state.chats;
      const idx = baseChats.findIndex(c=>c.id===chat.id);
      if(idx>-1) baseChats[idx] = chat; else baseChats.unshift(chat);
      state.chats = baseChats;
      const ok = await setData('chats', state.chats, true);
      renderChatList();
      renderConvHeader();
      toggleInfoPanel();
      if(!ok) showToast("Changes saved locally, but couldn't confirm they synced.");
    };

  // ---------------- Search ----------------
  document.getElementById('search-input').addEventListener('input', e=>{
    state.searchTerm = e.target.value;
    renderChatList();
  });

  // ---------------- Typing indicator ----------------
  // Ephemeral, relayed live over the WebSocket — never written to the
  // persisted store. Shows as a three-dot bubble at the end of the
  // conversation, like a normal incoming message, with the name(s)
  // of whoever's typing above it.
  const typingUsers = new Map(); // senderId -> {name, timeoutId}
  let lastTypingSentAt = 0;

  function clearTypingUsers(){
    typingUsers.forEach(u => clearTimeout(u.timeoutId));
    typingUsers.clear();
  }

  function renderTypingBubble(){
    const el = document.getElementById('messages-scroll');
    if(!el) return;
    let bubble = document.getElementById('typing-bubble-row');
    if(typingUsers.size === 0){
      if(bubble) bubble.remove();
      return;
    }
    const entries = Array.from(typingUsers.entries());
    const names = entries.map(([,u])=>u.name);
    let label;
    if(names.length === 1) label = names[0] + ' is typing';
    else if(names.length === 2) label = names[0] + ' and ' + names[1] + ' are typing';
    else label = names.slice(0,-1).join(', ') + ', and ' + names[names.length-1] + ' are typing';
    const wasNearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
    if(!bubble){
      bubble = document.createElement('div');
      bubble.id = 'typing-bubble-row';
      bubble.className = 'msg-row them';
    }
    const prof = state.profilesCache[entries[0][0]];
    bubble.innerHTML = `
      <div class="msg-avatar">${avatarHtml(prof, names[0])}</div>
      <div class="bubble-group">
        <div class="sender-label">${escapeHtml(label)}</div>
        <div class="bubble typing-bubble"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>
      </div>
    `;
    el.appendChild(bubble);
    if(wasNearBottom) el.scrollTop = el.scrollHeight;
  }

  function sendTypingSignal(){
    if(!state.currentChatId || !state.profile) return;
    const now = Date.now();
    if(now - lastTypingSentAt < 1500) return; // throttle
    lastTypingSentAt = now;
    if(ws && ws.readyState === WebSocket.OPEN){
      try{
        ws.send(JSON.stringify({
          type:'typing',
          chatId: state.currentChatId,
          senderId: state.profile.id,
          senderName: state.profile.name
        }));
      }catch(e){}
    }
  }

  // ---------------- Composer events ----------------
  const msgInput = document.getElementById('msg-input');
  msgInput.addEventListener('input', ()=>{ autosizeInput(msgInput); updateSendBtn(); sendTypingSignal(); });
  msgInput.addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });
  document.getElementById('send-btn').onclick = sendMessage;
  document.getElementById('compose-btn').onclick = showNewChatModal;
  document.getElementById('settings-btn').onclick = showSettingsModal;
  document.getElementById('info-btn').onclick = toggleInfoPanel;
  document.getElementById('back-btn').onclick = ()=>{
    document.getElementById('sidebar').classList.remove('hidden');
    document.getElementById('main').classList.add('hidden');
  };

  // ---------------- Connection status + WebSocket ----------------
  // red = disconnected, orange = connecting/reconnecting, green = connected.
  function setConnStatus(status){ // 'connecting' | 'connected' | 'disconnected'
    const dot = document.getElementById('conn-dot');
    if(!dot) return;
    dot.classList.remove('conn-connecting','conn-connected','conn-disconnected');
    dot.classList.add('conn-'+status);
    dot.title = status === 'connected' ? 'Connected'
      : status === 'connecting' ? 'Connecting…'
      : 'Disconnected — retrying';
  }

  let ws = null;
  let wsReconnectDelay = 1000;
  const WS_MAX_DELAY = 15000;
  let wsReconnectTimer = null;

  function connectWS(){
    setConnStatus('connecting');
    try{
      ws = new WebSocket(WS_URL);
    }catch(e){
      scheduleReconnect();
      return;
    }
    ws.onopen = ()=>{
      setConnStatus('connected');
      wsReconnectDelay = 1000;
      syncAll(); // catch up on anything missed while disconnected
    };
    ws.onmessage = (evt)=>{
      let msg;
      try{ msg = JSON.parse(evt.data); }catch(e){ return; }
      handleWsMessage(msg);
    };
    ws.onclose = ()=>{
      setConnStatus('disconnected');
      scheduleReconnect();
    };
    ws.onerror = ()=>{
      try{ ws.close(); }catch(e){}
    };
  }

  function scheduleReconnect(){
    if(wsReconnectTimer) return;
    wsReconnectTimer = setTimeout(()=>{
      wsReconnectTimer = null;
      connectWS();
    }, wsReconnectDelay);
    wsReconnectDelay = Math.min(wsReconnectDelay * 1.6, WS_MAX_DELAY);
  }

  function handleWsMessage(msg){
    if(!msg || typeof msg.type !== 'string') return;

    if(msg.type === 'typing'){
      if(!state.profile || msg.senderId === state.profile.id) return; // ignore our own
      if(msg.chatId !== state.currentChatId) return; // only care about the open chat
      const existing = typingUsers.get(msg.senderId);
      if(existing) clearTimeout(existing.timeoutId);
      const timeoutId = setTimeout(()=>{
        typingUsers.delete(msg.senderId);
        renderTypingBubble();
      }, 3000);
      typingUsers.set(msg.senderId, {name: msg.senderName || 'Someone', timeoutId});
      renderTypingBubble();
      return;
    }

    if(msg.type !== 'update' || typeof msg.key !== 'string') return;
    if(msg.key === 'chats'){
      if(Array.isArray(msg.value)){
        state.chats = msg.value;
        renderChatList();
        if(state.currentChatId){
          if(state.chats.find(c=>c.id===state.currentChatId)){
            renderConvHeader();
          }else{
            state.currentChatId = null;
            clearTypingUsers();
            showNoChatSelected();
          }
        }
      }
    }else if(msg.key.indexOf('messages:')===0){
      const chatId = msg.key.slice('messages:'.length);
      if(Array.isArray(msg.value)){
        state.messagesCache[chatId] = msg.value;
        if(chatId === state.currentChatId) renderMessages(chatId);
      }
    }else if(msg.key.indexOf('profiles:')===0){
      const uid = msg.key.slice('profiles:'.length);
      state.profilesCache[uid] = msg.value;
      renderChatList();
      if(state.currentChatId) renderMessages(state.currentChatId);
    }
  }

  // Best-effort resync, used right after a (re)connect and on a slow
  // fallback timer in case a push was ever missed. Critical rule: a
  // failed read must NEVER overwrite existing local state with an empty
  // list — that was the bug that made chats "disappear" before.
  async function syncAll(){
    await ensureProfileSynced();
    const chatsRes = await getDataOrKeep('chats', true);
    if(chatsRes.changed){
      state.chats = chatsRes.value;
      renderChatList();
    }
    if(state.currentChatId){
      const stillExists = state.chats.find(c=>c.id===state.currentChatId);
      if(stillExists){
        const msgsRes = await getDataOrKeep('messages:'+state.currentChatId, true);
        if(msgsRes.changed){
          state.messagesCache[state.currentChatId] = msgsRes.value;
          renderMessages(state.currentChatId);
        }
      }else if(chatsRes.changed){
        state.currentChatId = null;
        clearTypingUsers();
        showNoChatSelected();
      }
    }
  }
  // Realtime updates arrive over the WebSocket; this is just a safety net.
  setInterval(syncAll, 20000);

  // ---------------- Init ----------------
  async function init(){
    if(!state.profile){
      const profile = await getData('profile', false, null);
      if(!profile){
        showNamePrompt();
        return;
      }
      state.profile = profile;
    }
    state.chats = await getData('chats', true, []);
    renderChatList();
    updateSendBtn();
    if(window.innerWidth <= 680){
      document.getElementById('main').classList.add('hidden');
    }
  }

  init();
  connectWS();

})();
</script>
</body>
</html>
