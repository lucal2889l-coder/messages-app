<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages</title>
<style>
  :root{
    --blue:#0b84ff;
    --blue-dark:#0066e0;
    --bg:#ffffff;
    --sidebar-bg:#f6f6f7;
    --border:#e2e2e4;
    --text:#1c1c1e;
    --text-dim:#8a8a8e;
    --bubble-in:#e9e9eb;
    --bubble-in-text:#1c1c1e;
    --danger:#ff3b30;
    --warn:#ff9500;
    --ok:#34c759;
    --surface:#e5e5e7;
    --surface-hover:#dedee0;
    --field-border:#d5d5d7;
    --radius-bubble:18px;
  }

  /* ---------- Themes ---------- */
  /* "Light" is the base :root palette above. Each of these overrides
     the same variables, so the rest of the stylesheet never needs to
     know which theme is active — it just reads the variables. */
  :root[data-theme="dark"]{
    --blue:#0a84ff; --blue-dark:#409cff; --bg:#000000; --sidebar-bg:#1c1c1e;
    --border:#2c2c2e; --text:#f2f2f7; --text-dim:#8e8e93;
    --bubble-in:#2c2c2e; --bubble-in-text:#f2f2f7;
    --danger:#ff453a; --warn:#ff9f0a; --ok:#32d74b;
    --surface:#2c2c2e; --surface-hover:#3a3a3c; --field-border:#3a3a3c;
  }
  :root[data-theme="midnight"]{
    --blue:#5e9bff; --blue-dark:#7fb0ff; --bg:#0b0f1a; --sidebar-bg:#111827;
    --border:#1f2937; --text:#e5e7eb; --text-dim:#9ca3af;
    --bubble-in:#1f2937; --bubble-in-text:#e5e7eb;
    --danger:#f87171; --warn:#fbbf24; --ok:#34d399;
    --surface:#1f2937; --surface-hover:#293548; --field-border:#334155;
  }
  :root[data-theme="ocean"]{
    --blue:#0891b2; --blue-dark:#0e7490; --bg:#f0fdfd; --sidebar-bg:#e0f7f9;
    --border:#bae6ea; --text:#0f2e33; --text-dim:#5c8a8f;
    --bubble-in:#d3f1f3; --bubble-in-text:#0f2e33;
    --danger:#e11d48; --warn:#f59e0b; --ok:#059669;
    --surface:#dbf1f3; --surface-hover:#c7e9ec; --field-border:#a9dee2;
  }
  :root[data-theme="forest"]{
    --blue:#2f9e44; --blue-dark:#237a34; --bg:#f4faf3; --sidebar-bg:#e8f5e6;
    --border:#c8e6c2; --text:#1b3a1e; --text-dim:#5e7c60;
    --bubble-in:#dcefd8; --bubble-in-text:#1b3a1e;
    --danger:#e64553; --warn:#e08e0b; --ok:#2f9e44;
    --surface:#e2f0df; --surface-hover:#d3e8cf; --field-border:#bcdcb5;
  }
  :root[data-theme="sunset"]{
    --blue:#fb5607; --blue-dark:#e04e00; --bg:#fff8f4; --sidebar-bg:#ffefe6;
    --border:#ffd8bd; --text:#3a1f12; --text-dim:#9c7a63;
    --bubble-in:#ffe4d1; --bubble-in-text:#3a1f12;
    --danger:#e5383b; --warn:#ff9f1c; --ok:#2a9d8f;
    --surface:#ffe9dc; --surface-hover:#ffdcc6; --field-border:#ffcdac;
  }
  :root[data-theme="lavender"]{
    --blue:#7c3aed; --blue-dark:#6d28d9; --bg:#faf8ff; --sidebar-bg:#f1ebfe;
    --border:#ddd0fb; --text:#2e1a4d; --text-dim:#8a7aa8;
    --bubble-in:#e9e0fc; --bubble-in-text:#2e1a4d;
    --danger:#e5383b; --warn:#f0a500; --ok:#2e9e6d;
    --surface:#eee6fd; --surface-hover:#e2d5fb; --field-border:#d0bdf7;
  }
  :root[data-theme="rose"]{
    --blue:#e0447b; --blue-dark:#c73868; --bg:#fff5f8; --sidebar-bg:#ffe9f0;
    --border:#fac9db; --text:#3d1424; --text-dim:#a5718b;
    --bubble-in:#fdd9e6; --bubble-in-text:#3d1424;
    --danger:#d7263d; --warn:#f0a202; --ok:#2f9e5a;
    --surface:#fdeaf1; --surface-hover:#fbdce8; --field-border:#f6c2d6;
  }
  :root[data-theme="mono"]{
    --blue:#111111; --blue-dark:#000000; --bg:#ffffff; --sidebar-bg:#f2f2f2;
    --border:#d4d4d4; --text:#111111; --text-dim:#737373;
    --bubble-in:#eeeeee; --bubble-in-text:#111111;
    --danger:#b91c1c; --warn:#a16207; --ok:#166534;
    --surface:#e5e5e5; --surface-hover:#d4d4d4; --field-border:#c7c7c7;
  }
  :root[data-theme="solarized"]{
    --blue:#268bd2; --blue-dark:#2075b8; --bg:#002b36; --sidebar-bg:#073642;
    --border:#0a4552; --text:#eee8d5; --text-dim:#93a1a1;
    --bubble-in:#073642; --bubble-in-text:#eee8d5;
    --danger:#dc322f; --warn:#b58900; --ok:#859900;
    --surface:#0a4552; --surface-hover:#0d5567; --field-border:#0a4552;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;
    color:var(--text);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  #app{
    display:flex;
    height:100vh;
    width:100%;
    overflow:hidden;
    background:var(--bg);
    border:1px solid var(--border);
  }

  /* ---------- Access gate ---------- */
  #gate-screen{
    position:fixed;inset:0;
    background:var(--sidebar-bg);
    display:none;
    align-items:center;justify-content:center;
    z-index:1000;
  }
  #gate-box{
    background:var(--bg);border-radius:16px;padding:28px;
    width:300px;max-width:90%;
    box-shadow:0 10px 40px rgba(0,0,0,0.15);
    text-align:center;
  }
  #gate-box h2{margin:0 0 6px 0;font-size:17px;}
  #gate-box .field-input{margin-top:10px;text-align:center;}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:300px;
    min-width:220px;
    max-width:340px;
    background:var(--sidebar-bg);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    flex-shrink:0;
    position:relative;
  }
  #sidebar-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 16px 10px 16px;
  }
  #sidebar-header-title{
    display:flex;
    align-items:center;
    gap:7px;
    min-width:0;
    flex-wrap:wrap;
  }
  #sidebar-header h1{
    font-size:20px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.2px;
  }
  #conn-dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--danger);
    flex-shrink:0;
    transition:background-color .25s ease;
    box-shadow:0 0 0 3px rgba(0,0,0,0.04);
  }
  #conn-dot.conn-connecting{background:var(--warn);}
  #conn-dot.conn-connected{background:var(--ok);}
  #conn-dot.conn-disconnected{background:var(--danger);}
  .online-count{
    font-size:11px;color:var(--text-dim);white-space:nowrap;
    cursor:pointer;text-decoration:underline;text-decoration-style:dotted;
    text-underline-offset:2px;
  }
  .online-panel{
    display:none;
    position:absolute;top:46px;left:12px;
    background:var(--bg);border:1px solid var(--border);border-radius:12px;
    box-shadow:0 8px 30px rgba(0,0,0,0.15);
    padding:6px;width:200px;max-height:260px;overflow-y:auto;
    z-index:60;
  }
  .online-panel.show{display:block;}
  .online-panel-empty{font-size:12.5px;color:var(--text-dim);padding:8px;}
  .online-panel-row{display:flex;align-items:center;gap:8px;padding:6px;border-radius:8px;font-size:13px;}
  .online-panel-row:hover{background:var(--surface-hover);}
  .online-panel-avatar{width:24px;height:24px;border-radius:50%;overflow:hidden;flex-shrink:0;position:relative;}
  .online-panel-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  #compose-btn, #settings-btn{
    width:30px;height:30px;border-radius:50%;
    border:none;color:#fff;
    font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    transition:background-color .15s ease;
  }
  #compose-btn{background:var(--blue);}
  #compose-btn:hover{background:var(--blue-dark);}
  #settings-btn{background:var(--surface);color:var(--text);font-size:14px;}
  #settings-btn:hover{background:var(--surface-hover);}
  #search-wrap{padding:0 12px 10px 12px;}
  #search-input{
    width:100%;
    padding:7px 12px;
    border-radius:10px;
    border:none;
    background:var(--surface);
    font-size:14px;
    outline:none;
  }
  #chat-list{
    flex:1;
    overflow-y:auto;
    padding:4px 8px;
  }
  .chat-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 8px;
    border-radius:10px;
    cursor:pointer;
    margin-bottom:2px;
    transition:background-color .15s ease;
  }
  .chat-row:hover{background:var(--surface-hover);}
  .chat-row.active{background:var(--blue);}
  .chat-row.active .chat-title{color:#fff;}
  .chat-row.active .chat-preview{color:#dcebff;}
  .chat-row.active .chat-time{color:#dcebff;}
  .avatar{
    width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:600;font-size:15px;
    flex-shrink:0;
  }
  .chat-row-main{flex:1;min-width:0;}
  .chat-row-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;}
  .chat-title{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px;}
  .chat-time{font-size:12px;color:var(--text-dim);flex-shrink:0;}
  .chat-preview{font-size:13px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
  .lock-icon{flex-shrink:0;opacity:0.7;}
  .unread-badge{
    background:var(--danger);color:#fff;font-size:11px;font-weight:700;
    border-radius:10px;min-width:18px;height:18px;padding:0 5px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  #empty-sidebar{
    padding:40px 20px;text-align:center;color:var(--text-dim);font-size:13.5px;line-height:1.5;
  }

  /* ---------- Main / conversation ---------- */
  #main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
    position:relative;
  }
  #conv-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 16px;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  #back-btn{
    display:none;
    border:none;background:none;color:var(--blue);
    font-size:15px;cursor:pointer;padding:4px 6px 4px 0;
    flex-shrink:0;
  }
  #conv-header .avatar{width:32px;height:32px;font-size:13px;}
  #conv-title-wrap{flex:1;min-width:0;}
  #conv-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #conv-sub{font-size:12px;color:var(--text-dim);}
  #info-btn{
    border:none;background:none;color:var(--blue);
    font-size:20px;cursor:pointer;padding:2px 6px;
    flex-shrink:0;
  }
  #messages-scroll{
    flex:1;
    overflow-y:auto;
    padding:16px 16px 8px 16px;
    display:flex;
    flex-direction:column;
  }
  .msg-row{display:flex;margin-bottom:6px;align-items:flex-end;}
  .msg-row.me{justify-content:flex-end;}
  .msg-row.them{justify-content:flex-start;}
  .bubble-group{
    display:flex;
    flex-direction:column;
    max-width:62%;
    min-width:0;
  }
  .msg-row.me .bubble-group{align-items:flex-end;}
  .msg-row.them .bubble-group{align-items:flex-start;}
  .bubble{
    width:fit-content;
    max-width:100%;
    padding:8px 14px;
    border-radius:var(--radius-bubble);
    font-size:14.5px;
    line-height:1.35;
    cursor:pointer;
    box-shadow:0 1px 2px rgba(0,0,0,0.05);
  }
  .msg-text{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:break-word;}
  .msg-image{
    display:block;max-width:220px;max-height:260px;width:100%;height:auto;
    border-radius:14px;object-fit:cover;
  }
  .msg-image + .msg-text, .msg-image + .msg-image{margin-top:6px;}
  .msg-row.me .bubble{background:var(--blue);color:#fff;border-bottom-right-radius:5px;}
  .msg-row.them .bubble{background:var(--bubble-in);color:var(--bubble-in-text);border-bottom-left-radius:5px;}
  .msg-meta{font-size:11px;color:var(--text-dim);text-align:center;margin:14px 0 6px 0;}
  .sender-label{font-size:11.5px;color:var(--text-dim);margin:2px 12px 2px 2px;}
  .msg-avatar{
    width:34px;height:34px;border-radius:50%;
    overflow:hidden;flex-shrink:0;margin-right:6px;
    position:relative;
  }
  .msg-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .presence-dot{
    position:absolute;width:10px;height:10px;border-radius:50%;
    background:var(--ok);border:2px solid #fff;bottom:-1px;right:-1px;
  }
  .lightbox-overlay{background:rgba(0,0,0,0.85);cursor:zoom-out;}
  .lightbox-img{
    max-width:92vw;max-height:92vh;
    border-radius:12px;
    box-shadow:0 10px 50px rgba(0,0,0,0.5);
    cursor:zoom-out;
  }
  .theme-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:4px;}
  .theme-swatch{cursor:pointer;text-align:center;border-radius:10px;padding:4px;border:2px solid transparent;}
  .theme-swatch.selected{border-color:var(--blue);}
  .theme-swatch-inner{
    width:100%;aspect-ratio:1/1;border-radius:50%;
    border:1px solid var(--field-border);
    display:flex;align-items:center;justify-content:center;
  }
  .theme-swatch-dot{width:40%;height:40%;border-radius:50%;}
  .theme-swatch-label{font-size:9.5px;color:var(--text-dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .reply-preview{
    border-left:3px solid var(--blue);
    background:rgba(11,132,255,0.07);
    border-radius:8px;
    padding:4px 8px;margin-bottom:3px;
    font-size:12px;max-width:100%;
  }
  .reply-preview-name{font-weight:600;color:var(--blue);margin-right:4px;}
  .reply-preview-text{color:var(--text-dim);}
  .reactions-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;}
  .msg-row.me .reactions-row{justify-content:flex-end;}
  .reaction-pill{
    background:var(--surface);border-radius:12px;padding:2px 8px;
    font-size:12px;cursor:pointer;user-select:none;
    border:1px solid transparent;
  }
  .reaction-pill.mine{background:#dbeeff;border-color:var(--blue);}
  .msg-detail{margin-top:4px;font-size:11.5px;color:var(--text-dim);}
  .msg-detail-time{margin-bottom:4px;}
  .msg-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .msg-action-btn{
    border:none;background:var(--surface);border-radius:10px;
    padding:3px 10px;font-size:12px;cursor:pointer;color:var(--text);
  }
  .quick-reacts{display:flex;gap:4px;font-size:15px;}
  .quick-react-emoji{cursor:pointer;padding:2px;border-radius:6px;line-height:1;}
  .quick-react-emoji:hover{background:var(--surface);}
  #typing-bubble-row .bubble{background:var(--bubble-in);}

  #image-preview-wrap{padding:8px 14px 0 14px;display:none;}
  #image-preview-inner{position:relative;display:inline-block;}
  #image-preview-inner img{max-width:110px;max-height:110px;border-radius:10px;display:block;}
  #image-preview-remove{
    position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;
    border:none;background:#1c1c1e;color:#fff;font-size:11px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  #reply-banner{
    display:none;align-items:center;gap:8px;
    padding:6px 14px;font-size:12.5px;color:var(--text-dim);
    border-top:1px solid var(--border);background:var(--sidebar-bg);
  }
  #reply-banner b{color:var(--text);}
  #reply-banner-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #reply-banner-cancel{
    margin-left:auto;border:none;background:none;cursor:pointer;
    color:var(--text-dim);font-size:14px;flex-shrink:0;
  }
  #attach-btn{
    border:none;background:none;font-size:20px;cursor:pointer;
    padding:4px 2px;flex-shrink:0;color:var(--text-dim);
  }
  .gif-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:260px;overflow-y:auto;}
  .gif-thumb{border-radius:8px;overflow:hidden;cursor:pointer;background:var(--surface);aspect-ratio:1/1;}
  .gif-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .gif-grid-loading, .gif-grid-empty{grid-column:1/-1;font-size:12.5px;color:var(--text-dim);text-align:center;padding:16px 4px;}

  #composer{
    display:flex;
    align-items:flex-end;
    gap:8px;
    padding:10px 14px 14px 14px;
    border-top:1px solid var(--border);
    flex-shrink:0;
  }
  #msg-input{
    flex:1;
    border:1px solid var(--field-border);
    border-radius:18px;
    padding:8px 14px;
    font-size:14.5px;
    resize:none;
    max-height:120px;
    outline:none;
    font-family:inherit;
    line-height:1.35;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  #msg-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,132,255,0.12);}
  #send-btn{
    width:32px;height:32px;border-radius:50%;
    border:none;background:var(--blue);color:#fff;
    font-size:15px;cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  #send-btn:disabled{background:#c7c7c9;cursor:default;}

  #no-chat-selected{
    flex:1;display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);font-size:14px;text-align:center;flex-direction:column;gap:10px;
  }
  #no-chat-selected .big-icon{font-size:40px;opacity:0.5;}

  /* ---------- Modal / overlay ---------- */
  .overlay{
    position:absolute;inset:0;
    background:rgba(0,0,0,0.28);
    display:flex;align-items:center;justify-content:center;
    z-index:50;
    animation:fadeIn .15s ease;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal{
    background:var(--bg);border-radius:14px;
    width:320px;max-width:90%;
    padding:20px;
    box-shadow:0 10px 40px rgba(0,0,0,0.2);
    animation:modalPop .15s ease;
  }
  @keyframes modalPop{from{opacity:0;transform:scale(0.97);}to{opacity:1;transform:scale(1);}}
  .modal h2{margin:0 0 14px 0;font-size:16px;font-weight:700;}
  .field-label{font-size:12.5px;color:var(--text-dim);margin:10px 0 4px 0;font-weight:500;}
  .field-input{
    width:100%;padding:8px 10px;border-radius:8px;
    border:1px solid var(--field-border);font-size:14px;outline:none;font-family:inherit;
    background:var(--bg);color:var(--text);
  }
  .field-input:focus{border-color:var(--blue);}
  .checkbox-row{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13.5px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .btn{
    border:none;border-radius:8px;padding:7px 14px;font-size:14px;cursor:pointer;font-weight:500;
  }
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:disabled{background:#c7c7c9;cursor:default;}
  .btn-secondary{background:var(--surface);color:var(--text);}
  .btn-danger{background:var(--danger);color:#fff;}
  .error-text{color:var(--danger);font-size:12.5px;margin-top:8px;min-height:14px;}
  .lock-big{font-size:30px;text-align:center;margin-bottom:4px;}
  .subtle-note{font-size:12px;color:var(--text-dim);margin-top:10px;line-height:1.4;}

  /* Info panel */
  #info-panel{
    position:absolute;top:0;right:0;bottom:0;
    width:280px;max-width:80%;
    background:var(--bg);border-left:1px solid var(--border);
    box-shadow:-6px 0 24px rgba(0,0,0,0.08);
    display:flex;flex-direction:column;
    z-index:40;
    transform:translateX(0);
  }
  #info-panel-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;border-bottom:1px solid var(--border);
  }
  #info-panel-header h3{margin:0;font-size:15px;}
  #info-panel-close{border:none;background:none;font-size:15px;color:var(--blue);cursor:pointer;}
  #info-panel-body{padding:16px;overflow-y:auto;flex:1;}

  /* Toast */
  #toast{
    position:fixed;left:50%;bottom:24px;
    transform:translate(-50%, 12px);
    background:#1c1c1e;color:#fff;
    padding:10px 16px;border-radius:10px;
    font-size:13px;line-height:1.4;
    opacity:0;pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:100;max-width:80%;text-align:center;
    box-shadow:0 6px 20px rgba(0,0,0,0.2);
  }
  #toast.show{opacity:1;transform:translate(-50%, 0);pointer-events:auto;}

  .typing-bubble{display:flex;align-items:center;gap:4px;padding:11px 14px;}
  .typing-dot{
    width:6px;height:6px;border-radius:50%;
    background:#9a9a9e;display:inline-block;
    animation:typing-bounce 1.2s infinite ease-in-out;
  }
  .typing-dot:nth-child(2){animation-delay:0.15s;}
  .typing-dot:nth-child(3){animation-delay:0.3s;}
  @keyframes typing-bounce{
    0%,60%,100%{transform:translateY(0);opacity:0.5;}
    30%{transform:translateY(-4px);opacity:1;}
  }

  @media (max-width:680px){
    #sidebar{
      width:100%;max-width:none;
      position:absolute;inset:0;z-index:5;
    }
    #sidebar.hidden{display:none;}
    #main.hidden{display:none;}
    #back-btn{display:inline-block;}
    #app{border:none;}
    .bubble-group{max-width:78%;}
  }
</style>
</head>
<body>

<div id="gate-screen">
  <div id="gate-box">
    <div style="font-size:32px;margin-bottom:8px;">🔒</div>
    <h2>Enter Access Key</h2>
    <div class="field-label" style="margin-top:0;">This app is private. Enter the key to continue.</div>
    <input id="gate-key-input" class="field-input" type="password" autocomplete="off">
    <div class="error-text" id="gate-error"></div>
    <button class="btn btn-primary" id="gate-submit" style="width:100%;margin-top:12px;">Enter</button>
  </div>
</div>

<div id="app">

  <div id="sidebar">
    <div id="sidebar-header">
      <div id="sidebar-header-title">
        <h1>Messages</h1>
        <span id="conn-dot" class="conn-disconnected" title="Disconnected"></span>
        <span id="online-count" class="online-count" title="Click to see who"></span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button id="settings-btn" title="Settings">⚙</button>
        <button id="compose-btn" title="New chat">✎</button>
      </div>
    </div>
    <div id="online-panel" class="online-panel"></div>
    <div id="search-wrap">
      <input id="search-input" type="text" placeholder="Search">
    </div>
    <div id="chat-list"></div>
  </div>

  <div id="main">
    <div id="no-chat-selected">
      <div class="big-icon">💬</div>
      <div>Select a chat, or start a new one.</div>
    </div>

    <div id="conv-header" style="display:none;">
      <button id="back-btn">‹ Back</button>
      <div class="avatar" id="conv-avatar"></div>
      <div id="conv-title-wrap">
        <div id="conv-title"></div>
        <div id="conv-sub"></div>
      </div>
      <button id="info-btn" title="Chat info">ⓘ</button>
    </div>

    <div id="messages-scroll" style="display:none;"></div>

    <div id="image-preview-wrap">
      <div id="image-preview-inner">
        <img id="image-preview-img" src="" alt="">
        <button id="image-preview-remove" title="Remove photo">✕</button>
      </div>
    </div>
    <div id="reply-banner">
      Replying to <b id="reply-banner-name"></b>:
      <span id="reply-banner-text"></span>
      <button id="reply-banner-cancel" title="Cancel reply">✕</button>
    </div>

    <div id="composer" style="display:none;">
      <button id="attach-btn" title="Photo or GIF">📷</button>
      <textarea id="msg-input" rows="1" placeholder="iMessage"></textarea>
      <button id="send-btn">↑</button>
    </div>
    <input type="file" id="msg-image-input" accept="image/*" style="display:none;">

    <div id="info-panel" style="display:none;"></div>
  </div>

</div>

<div id="modal-root"></div>

<script>
(function(){

  // ---------------- Storage ----------------
  // Private profile data stays in this browser.
  // Shared chats/messages live on the Render server. This page is hosted
  // statically on GitHub Pages, so it talks to that server over its full
  // URL (both plain HTTPS calls and a WebSocket), not relative paths.
  const SERVER_ORIGIN = 'https://messages-server-waf1.onrender.com';
  const API_BASE = SERVER_ORIGIN + '/api/data/';
  const WS_BASE_URL = SERVER_ORIGIN.replace(/^http/, 'ws') + '/ws';
  const GIF_REPO_API = 'https://api.github.com/repos/lucal2889l-coder/messages-app/contents/gifs';

  // ---------------- Access key ----------------
  // The real key lives only on the server. This browser just proves it
  // knows the key (via /api/auth) and then re-sends it on every request
  // — the server is what actually enforces access, not this file.
  const GATE_KEY_STORAGE = 'site_key';
  let SITE_KEY_VALUE = null;

  function getStoredSiteKey(){
    try{ return localStorage.getItem(GATE_KEY_STORAGE); }catch(e){ return null; }
  }
  async function verifyKeyWithServer(key){
    try{
      const res = await fetch(SERVER_ORIGIN + '/api/auth', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({key})
      });
      return res.ok;
    }catch(e){
      return false;
    }
  }
  function siteKeyHeaders(extra){
    return Object.assign({'X-Site-Key': SITE_KEY_VALUE || ''}, extra || {});
  }
  function handleUnauthorized(){
    try{ localStorage.removeItem(GATE_KEY_STORAGE); }catch(e){}
    showToast('Access key no longer valid — reloading.');
    setTimeout(()=> location.reload(), 1200);
  }

  const privateStorage = {
    async get(key){
      const raw = localStorage.getItem(key);
      if(raw === null) throw new Error('key not found');
      return {key, value: raw, shared:false};
    },
    async set(key, value){
      localStorage.setItem(key, value);
      return {key, value, shared:false};
    },
    async delete(key){
      localStorage.removeItem(key);
      return {key, deleted:true, shared:false};
    }
  };

  async function serverGet(key){
    const res = await fetch(API_BASE + encodeURIComponent(key), {
      headers: siteKeyHeaders()
    });
    if(res.status === 401){ handleUnauthorized(); throw new Error('unauthorized'); }
    if(res.status === 404) throw new Error('key not found');
    if(!res.ok) throw new Error('server read failed');
    const data = await res.json();
    return {key, value: JSON.stringify(data.value), shared:true};
  }

  async function serverSet(key, value){
    const res = await fetch(API_BASE + encodeURIComponent(key), {
      method:'PUT',
      headers: siteKeyHeaders({'Content-Type':'application/json'}),
      body:JSON.stringify({value: JSON.parse(value)})
    });
    if(res.status === 401){ handleUnauthorized(); throw new Error('unauthorized'); }
    if(!res.ok) throw new Error('server write failed');
    const data = await res.json();
    return {key, value: JSON.stringify(data.value), shared:true};
  }

  async function storageGet(key, shared){
    return shared ? serverGet(key) : privateStorage.get(key);
  }

  async function storageSet(key, value, shared){
    return shared ? serverSet(key, value) : privateStorage.set(key, value);
  }

  async function storageDelete(key, shared){
    if(shared){
      const res = await fetch(API_BASE + encodeURIComponent(key), {
        method:'DELETE',
        headers: siteKeyHeaders()
      });
      if(res.status === 401){ handleUnauthorized(); throw new Error('unauthorized'); }
      if(!res.ok && res.status !== 404) throw new Error('server delete failed');
      return {key, deleted:true, shared:true};
    }
    return privateStorage.delete(key);
  }

  async function getData(key, shared, fallback){
    try{
      const res = await storageGet(key, shared);
      return res ? JSON.parse(res.value) : fallback;
    }catch(e){
      return fallback;
    }
  }

  async function getDataOrKeep(key, shared){
    try{
      const res = await storageGet(key, shared);
      return {changed:true, value: res ? JSON.parse(res.value) : []};
    }catch(e){
      return {changed:false};
    }
  }

  async function setData(key, value, shared){
    try{
      await storageSet(key, JSON.stringify(value), shared);
      return true;
    }catch(e){
      console.error('storage set failed', key, e);
      return false;
    }
  }

  function genId(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  }

  async function hashPassword(pw){
    try{
      const enc = new TextEncoder().encode(pw);
      const buf = await crypto.subtle.digest('SHA-256', enc);
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }catch(e){
      let h = 0;
      for(let i=0;i<pw.length;i++){ h = ((h<<5)-h+pw.charCodeAt(i))|0; }
      return 'fb'+h;
    }
  }

  // ---------------- Toast ----------------
  function showToast(msg){
    let el = document.getElementById('toast');
    if(!el){
      el = document.createElement('div');
      el.id = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> el.classList.remove('show'), 3500);
  }

  // ---------------- Favicon ----------------
  function setFavicon(emoji){
    let link = document.querySelector('link[rel="icon"]');
    if(!link){
      link = document.createElement('link');
      link.rel = 'icon';
      document.head.appendChild(link);
    }
    try{
      const canvas = document.createElement('canvas');
      canvas.width = 64; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.font = '54px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(emoji, 32, 36);
      link.href = canvas.toDataURL('image/png');
    }catch(e){}
  }
  setFavicon('💬'); // default tab icon, shown even before the gate is passed

  // ---------------- Themes ----------------
  const THEMES = [
    {slug:'light', name:'Light', swatchBg:'#ffffff', swatchAccent:'#0b84ff'},
    {slug:'dark', name:'Dark', swatchBg:'#000000', swatchAccent:'#0a84ff'},
    {slug:'midnight', name:'Midnight', swatchBg:'#0b0f1a', swatchAccent:'#5e9bff'},
    {slug:'ocean', name:'Ocean', swatchBg:'#f0fdfd', swatchAccent:'#0891b2'},
    {slug:'forest', name:'Forest', swatchBg:'#f4faf3', swatchAccent:'#2f9e44'},
    {slug:'sunset', name:'Sunset', swatchBg:'#fff8f4', swatchAccent:'#fb5607'},
    {slug:'lavender', name:'Lavender', swatchBg:'#faf8ff', swatchAccent:'#7c3aed'},
    {slug:'rose', name:'Rose', swatchBg:'#fff5f8', swatchAccent:'#e0447b'},
    {slug:'mono', name:'Mono', swatchBg:'#ffffff', swatchAccent:'#111111'},
    {slug:'solarized', name:'Solarized', swatchBg:'#002b36', swatchAccent:'#268bd2'}
  ];
  const THEME_STORAGE_KEY = 'theme';
  function getStoredTheme(){
    try{ return localStorage.getItem(THEME_STORAGE_KEY) || 'light'; }catch(e){ return 'light'; }
  }
  function applyTheme(slug){
    document.documentElement.setAttribute('data-theme', slug);
  }
  function setTheme(slug){
    applyTheme(slug);
    try{ localStorage.setItem(THEME_STORAGE_KEY, slug); }catch(e){}
  }
  applyTheme(getStoredTheme()); // applied immediately, even before the access gate

  function themeGridHtml(current){
    return THEMES.map(t=>{
      const selected = t.slug === current;
      return `<div class="theme-swatch${selected?' selected':''}" data-theme-slug="${t.slug}" title="${escapeHtml(t.name)}">
        <div class="theme-swatch-inner" style="background:${t.swatchBg};">
          <span class="theme-swatch-dot" style="background:${t.swatchAccent};"></span>
        </div>
        <div class="theme-swatch-label">${escapeHtml(t.name)}</div>
      </div>`;
    }).join('');
  }

  // ---------------- App state ----------------
  const state = {
    profile: null,          // {id, name, avatar}
    chats: [],               // array of chat objects
    currentChatId: null,
    unlockedChatIds: new Set(), // session-only
    messagesCache: {},       // chatId -> array of messages
    profilesCache: {},       // senderId -> {id, name, avatar} | null
    onlineUsers: [],         // [{id, name}]
    unreadCounts: {},        // chatId -> count (local only, resets on reload)
    expandedMsgId: null,     // message currently showing its detail/actions row
    replyingTo: null,        // {id, senderName, preview}
    pendingImage: null,      // data URL of an attached-but-unsent photo
    searchTerm: ''
  };

  const QUICK_REACT_EMOJIS = ['👍','❤️','😂','😮','😢','🙏'];
  const BASE_TITLE = document.title;

  function isOnline(id){
    return id && state.onlineUsers.some(u => u.id === id);
  }

  const AVATAR_COLORS = ['#ff9500','#ff3b30','#af52de','#5856d6','#007aff','#34c759','#ff2d55','#5ac8fa','#ffcc00'];
  function colorForName(name){
    let h=0;
    for(let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }
  function initialsForName(name){
    const parts = name.trim().split(/\s+/).filter(Boolean);
    if(parts.length===0) return '?';
    if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0]+parts[1][0]).toUpperCase();
  }

  function isSafeImageDataUrl(url, maxLen){
    return typeof url === 'string'
      && url.length < (maxLen || 200000)
      && /^data:image\/(png|jpe?g|gif|webp);base64,[A-Za-z0-9+/=]+$/.test(url);
  }
  function isSafeGifUrl(url){
    return typeof url === 'string'
      && url.length < 2000
      && /^https:\/\/raw\.githubusercontent\.com\//.test(url);
  }

  function avatarHtml(profile, fallbackName, senderId){
    let inner;
    if(profile && isSafeImageDataUrl(profile.avatar, 200000)){
      inner = `<img src="${profile.avatar}" alt="">`;
    }else{
      const name = (profile && profile.name) || fallbackName || '?';
      inner = `<div class="avatar" style="width:100%;height:100%;font-size:13px;background:${colorForName(name)};">${initialsForName(name)}</div>`;
    }
    const online = isOnline(senderId);
    return inner + (online ? '<span class="presence-dot" title="Online"></span>' : '');
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.innerText = str;
    return d.innerHTML;
  }

  function fmtTime(ts){
    const d = new Date(ts);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    if(sameDay) return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
    const oneWeek = 6*24*60*60*1000;
    if(now - d < oneWeek) return d.toLocaleDateString([], {weekday:'short'});
    return d.toLocaleDateString([], {month:'short', day:'numeric'});
  }

  // ---------------- Unread badge + favicon ----------------
  function totalUnread(){
    return Object.values(state.unreadCounts).reduce((a,b)=>a+b,0);
  }
  function updateUnreadUI(){
    const total = totalUnread();
    if(total > 0){
      document.title = `(${total}) ${BASE_TITLE}`;
      setFavicon('⚠️');
    }else{
      document.title = BASE_TITLE;
      setFavicon('💬');
    }
  }
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible' && state.currentChatId){
      if(state.unreadCounts[state.currentChatId]){
        state.unreadCounts[state.currentChatId] = 0;
        updateUnreadUI();
        renderChatList();
      }
    }
  });

  // ---------------- Online presence ----------------
  function sendIdentify(){
    if(ws && ws.readyState === WebSocket.OPEN && state.profile){
      try{
        ws.send(JSON.stringify({type:'identify', id: state.profile.id, name: state.profile.name}));
      }catch(e){}
    }
  }
  function updateOnlineCountUI(){
    const el = document.getElementById('online-count');
    if(!el) return;
    const n = state.onlineUsers.length;
    el.textContent = n > 0 ? (n + ' online') : '';
    renderOnlinePanel();
  }
  function renderOnlinePanel(){
    const panel = document.getElementById('online-panel');
    if(!panel) return;
    if(state.onlineUsers.length === 0){
      panel.innerHTML = '<div class="online-panel-empty">No one else is online.</div>';
      return;
    }
    panel.innerHTML = state.onlineUsers.map(u=>{
      const prof = state.profilesCache[u.id];
      const mine = state.profile && u.id === state.profile.id;
      return `<div class="online-panel-row">
        <div class="online-panel-avatar">${avatarHtml(prof, u.name, u.id)}</div>
        <span>${escapeHtml(u.name)}${mine ? ' (you)' : ''}</span>
      </div>`;
    }).join('');
  }
  document.getElementById('online-count').onclick = (e)=>{
    e.stopPropagation();
    document.getElementById('online-panel').classList.toggle('show');
  };
  document.addEventListener('click', (e)=>{
    const panel = document.getElementById('online-panel');
    if(panel && panel.classList.contains('show') && !panel.contains(e.target) && e.target.id !== 'online-count'){
      panel.classList.remove('show');
    }
  });

  // ---------------- Modal system ----------------
  const modalRoot = document.getElementById('modal-root');
  function closeModal(){ modalRoot.innerHTML = ''; }
  function openModal(html){ modalRoot.innerHTML = '<div class="overlay" id="active-overlay">'+html+'</div>'; }

  // ---------------- Name onboarding ----------------
  function showNamePrompt(){
    openModal(`
      <div class="modal">
        <h2>What should we call you?</h2>
        <input id="name-input" class="field-input" type="text" placeholder="Your name" maxlength="30" autofocus>
        <div class="error-text" id="name-error"></div>
        <div class="modal-actions">
          <button class="btn btn-primary" id="name-save-btn">Continue</button>
        </div>
      </div>
    `);
    const input = document.getElementById('name-input');
    input.focus();
    const save = async ()=>{
      const name = input.value.trim();
      if(!name){ document.getElementById('name-error').textContent = 'Please enter a name.'; return; }
      const profile = {id: genId(), name, avatar: null};
      await setData('profile', profile, false);
      state.profile = profile;
      pushProfileToServer(profile);
      sendIdentify();
      closeModal();
      init();
    };
    document.getElementById('name-save-btn').onclick = save;
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') save(); });
  }

  // ---------------- New chat modal ----------------
  function showNewChatModal(){
    openModal(`
      <div class="modal">
        <h2>New Chat</h2>
        <div class="checkbox-row" style="margin-top:0;">
          <input type="checkbox" id="new-chat-dm">
          <label for="new-chat-dm">Direct message (just the two of you)</label>
        </div>
        <div class="field-label" id="new-chat-title-label">Chat name</div>
        <input id="new-chat-title" class="field-input" type="text" placeholder="e.g. Weekend Trip" maxlength="40" autofocus>
        <div class="checkbox-row">
          <input type="checkbox" id="new-chat-locked">
          <label for="new-chat-locked">Lock this chat with a password</label>
        </div>
        <div id="new-chat-pw-fields" style="display:none;">
          <div class="field-label">Password</div>
          <input id="new-chat-pw" class="field-input" type="password" maxlength="60">
          <div class="field-label">Confirm password</div>
          <input id="new-chat-pw2" class="field-input" type="password" maxlength="60">
        </div>
        <div class="error-text" id="new-chat-error"></div>
        <div class="modal-actions">
          <button class="btn btn-secondary" id="new-chat-cancel">Cancel</button>
          <button class="btn btn-primary" id="new-chat-create">Create</button>
        </div>
      </div>
    `);
    const lockedBox = document.getElementById('new-chat-locked');
    const pwFields = document.getElementById('new-chat-pw-fields');
    lockedBox.onchange = ()=>{ pwFields.style.display = lockedBox.checked ? 'block' : 'none'; };
    const dmBox = document.getElementById('new-chat-dm');
    const titleLabel = document.getElementById('new-chat-title-label');
    const titleInput = document.getElementById('new-chat-title');
    dmBox.onchange = ()=>{
      if(dmBox.checked){
        titleLabel.textContent = "Who's this with?";
        titleInput.placeholder = 'Their name';
      }else{
        titleLabel.textContent = 'Chat name';
        titleInput.placeholder = 'e.g. Weekend Trip';
      }
    };
    document.getElementById('new-chat-cancel').onclick = closeModal;
    titleInput.focus();

    document.getElementById('new-chat-create').onclick = async ()=>{
      const errEl = document.getElementById('new-chat-error');
      const title = titleInput.value.trim();
      if(!title){ errEl.textContent = dmBox.checked ? "Please enter who it's with." : 'Please give the chat a name.'; return; }
      let locked = lockedBox.checked;
      let passwordHash = null;
      if(locked){
        const pw = document.getElementById('new-chat-pw').value;
        const pw2 = document.getElementById('new-chat-pw2').value;
        if(pw.length < 4){ errEl.textContent = 'Password must be at least 4 characters.'; return; }
        if(pw !== pw2){ errEl.textContent = 'Passwords do not match.'; return; }
        passwordHash = await hashPassword(pw);
      }
      const chat = {
        id: genId(),
        title,
        isDM: dmBox.checked,
        locked,
        passwordHash,
        createdAt: Date.now(),
        lastMessageAt: Date.now(),
        lastMessage: '',
        lastSenderName: '',
        lastSenderId: null
      };
      const fresh = await getDataOrKeep('chats', true);
      const baseChats = fresh.changed ? fresh.value : state.chats;
      baseChats.unshift(chat);
      state.chats = baseChats;
      const ok = await setData('chats', state.chats, true);
      await setData('messages:'+chat.id, [], true);
      state.unlockedChatIds.add(chat.id);
      closeModal();
      renderChatList();
      selectChat(chat.id);
      if(!ok) showToast("Chat created, but couldn't confirm it saved — check your connection.");
    };
  }

  // ---------------- Password prompt (for locked chats) ----------------
  function showPasswordPrompt(chat, onSuccess){
    openModal(`
      <div class="modal">
        <div class="lock-big">🔒</div>
        <h2 style="text-align:center;">${escapeHtml(chat.title)}</h2>
        <div class="field-label">This chat is locked. Enter the password to open it.</div>
        <input id="unlock-pw" class="field-input" type="password" autofocus>
        <div class="error-text" id="unlock-error"></div>
        <div class="modal-actions">
          <button class="btn btn-secondary" id="unlock-cancel">Cancel</button>
          <button class="btn btn-primary" id="unlock-submit">Unlock</button>
        </div>
      </div>
    `);
    const input = document.getElementById('unlock-pw');
    input.focus();
    document.getElementById('unlock-cancel').onclick = closeModal;
    const attempt = async ()=>{
      const pw = input.value;
      const h = await hashPassword(pw);
      if(h === chat.passwordHash){
        state.unlockedChatIds.add(chat.id);
        closeModal();
        onSuccess();
      }else{
        document.getElementById('unlock-error').textContent = 'Incorrect password.';
      }
    };
    document.getElementById('unlock-submit').onclick = attempt;
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') attempt(); });
  }

  // ---------------- Settings / profile (name + photo) ----------------
  function readAndResizeImage(file, maxDim, quality){
    maxDim = maxDim || 160;
    quality = quality || 0.82;
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onerror = ()=> reject(new Error('read failed'));
      reader.onload = ()=>{
        const img = new Image();
        img.onerror = ()=> reject(new Error('decode failed'));
        img.onload = ()=>{
          let width = img.naturalWidth, height = img.naturalHeight;
          if(width > height){
            if(width > maxDim){ height = Math.round(height * (maxDim/width)); width = maxDim; }
          }else{
            if(height > maxDim){ width = Math.round(width * (maxDim/height)); height = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

    const matches = serverCopy

  function renderMessages(chatId){
    const el = document.getElementById('messages-scroll');
    const msgs = state.messagesCache[chatId] || [];
    const wasNearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
    let lastDay = null;
    let html = '';
    const missingProfiles = new Set();
    msgs.forEach(m=>{
      const day = new Date(m.ts).toDateString();
      if(day !== lastDay){
        html += `<div class="msg-meta">${new Date(m.ts).toLocaleDateString([], {weekday:'long', month:'short', day:'numeric'})}</div>`;
        lastDay = day;
      }
      const mine = m.senderId === state.profile.id;
      html += `<div class="msg-row ${mine?'me':'them'}" data-msg-id="${m.id}">`;
      if(!mine){
        const prof = state.profilesCache[m.senderId];
        if(prof === undefined) missingProfiles.add(m.senderId);
        html += `<div class="msg-avatar">${avatarHtml(prof, m.senderName, m.senderId)}</div>`;
      }
      html += `<div class="bubble-group">`;
      if(!mine) html += `<div class="sender-label">${escapeHtml(m.senderName)}</div>`;
      html += replyPreviewHtml(m);
      html += `<div class="bubble" data-msg-id="${m.id}">${bubbleContentHtml(m)}</div>`;
      html += reactionsHtml(m);
      if(state.expandedMsgId === m.id) html += msgDetailHtml(m);
      html += `</div></div>`;
    });
    el.innerHTML = html || '';
    renderTypingBubble();
    if(wasNearBottom){ el.scrollTop = el.scrollHeight; }
    if(missingProfiles.size){
      Promise.all(Array.from(missingProfiles).map(async uid=>{
        const p = await getData('profiles:'+uid, true, null);
        state.profilesCache[uid] = p;
      })).then(()=>{
        if(chatId === state.currentChatId) renderMessages(chatId);
      });
    }
  }

  document.getElementById('messages-scroll').addEventListener('click', (e)=>{

    if(reactEmoji){
      const msgId = reactEmoji.closest('.quick-reacts').dataset.msgId;
      const emoji = reactEmoji.dataset.emoji;
      if(state.currentChatId && state.profile){
        updateMessage(state.currentChatId, msgId, toggleReactionMutator(emoji, state.profile.id));

      return;

    const pill = e.target.closest('.reaction-pill');
    if(pill){
      const msgId = pill.dataset.msgId;
      const emoji = pill.dataset.emoji;
      if(state.currentChatId && state.profile){
        updateMessage(state.currentChatId, msgId, toggleReactionMutator(emoji, state.profile.id));
      }
      return;
    }
    const replyBtn = e.target.closest('.msg-action-reply');
    if(replyBtn){
      const msgId = replyBtn.dataset.msgId;
      const msgs = state.messagesCache[state.currentChatId] || [];
      const m = msgs.find(x=>x.id===msgId);

      renderMessages(state.currentChatId);

    if(bubble && bubble.dataset.msgId){
      const msgId = bubble.dataset.msgId;
      state.expandedMsgId = (state.expandedMsgId === msgId) ? null : msgId;
      renderMessages(state.currentChatId);
    }
  });

  async function updateMessage(chatId, msgId, mutator){
    const fresh = await getDataOrKeep('messages:'+chatId, true);
    const msgs = fresh.changed ? fresh.value : (state.messagesCache[chatId] || []).slice();
    const idx = msgs.findIndex(m => m.id === msgId);
    if(idx === -1) return false;
    mutator(msgs[idx]);
    state.messagesCache[chatId] = msgs;
    renderMessages(chatId);
    const ok = await setData('messages:'+chatId, msgs, true);
    if(!ok) showToast("Couldn't sync that change — check your connection.");
    return ok;
  }

  function toggleReactionMutator(emoji, userId){
    return (msg)=>{
      if(!msg.reactions) msg.reactions = {};
      const arr = msg.reactions[emoji] || [];
      const i = arr.indexOf(userId);
      if(i === -1) arr.push(userId); else arr.splice(i,1);
      if(arr.length === 0) delete msg.reactions[emoji];
      else msg.reactions[emoji] = arr;
    };
  }

    try{

      if(!res.ok) throw new Error('failed to list gifs');
      const data = await res.json();
      const gifs = Array.isArray(data)
        ? data.filter(f => f && f.type === 'file' && /\.gif$/i.test(f.name) && typeof f.download_url === 'string')
            .map(f => ({ name: f.name, url: f.download_url }))

      return gifs;

  async function sendGifMessage(url){
    if(!state.currentChatId || !isSafeGifUrl(url)) return;
    const chatId = state.currentChatId;
    const replyTo = state.replyingTo ? {
      id: state.replyingTo.id,
      senderName: state.replyingTo.senderName,
      text: state.replyingTo.preview
    } : null;
    state.replyingTo = null;
    renderReplyBanner();

    const fresh = await getDataOrKeep('messages:'+chatId, true);
    const msgs = fresh.changed ? fresh.value : (state.messagesCache[chatId] || []).slice();
    const msg = {
      id: genId(),
      senderId: state.profile.id,
      senderName: state.profile.name,
      text: '',
      image: null,
      gif: url,
      ts: Date.now(),
      reactions: {},
      replyTo
    };
    msgs.push(msg);
    const saved = await setData('messages:'+chatId, msgs, true);
    state.messagesCache[chatId] = msgs;
    renderMessages(chatId);
    const el = document.getElementById('messages-scroll');
    el.scrollTop = el.scrollHeight;

    const freshChats = await getDataOrKeep('chats', true);
    const chats = freshChats.changed ? freshChats.value : state.chats;
    const idx = chats.findIndex(c=>c.id===chatId);
    if(idx>-1){
      chats[idx].lastMessage = '🎞️ GIF';
      chats[idx].lastSenderName = msg.senderName;
      chats[idx].lastSenderId = msg.senderId;
      chats[idx].lastMessageAt = msg.ts;
      state.chats = chats;
      await setData('chats', chats, true);
      renderChatList();
    }
  }

  // ---------------- Sending messages ----------------
  async function sendMessage(){
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    const image = state.pendingImage;
    if((!text && !image) || !state.currentChatId) return;
    const chatId = state.currentChatId;
    const replyTo = state.replyingTo ? {
      id: state.replyingTo.id,
      senderName: state.replyingTo.senderName,
      text: state.replyingTo.preview
    } : null;
    input.value = '';
    autosizeInput(input);
    state.pendingImage = null;
    state.replyingTo = null;
    renderImagePreview();
    renderReplyBanner();
    updateSendBtn();

    const fresh = await getDataOrKeep('messages:'+chatId, true);
    const msgs = fresh.changed ? fresh.value : (state.messagesCache[chatId] || []).slice();
    const msg = {
      id: genId(),
      senderId: state.profile.id,
      senderName: state.profile.name,
      text,
      image: image || null,
      gif: null,
      ts: Date.now(),
      reactions: {},
      replyTo
    };
    msgs.push(msg);
    const saved = await setData('messages:'+chatId, msgs, true);
    state.messagesCache[chatId] = msgs;
    renderMessages(chatId);
    const el = document.getElementById('messages-scroll');
    el.scrollTop = el.scrollHeight;
    if(!saved) showToast("Message may not have saved — check your connection.");

    const freshChats = await getDataOrKeep('chats', true);
    const chats = freshChats.changed ? freshChats.value : state.chats;
    const idx = chats.findIndex(c=>c.id===chatId);
    if(idx>-1){
      chats[idx].lastMessage = image ? (text ? '📷 '+text : '📷 Photo') : text;
      chats[idx].lastSenderName = msg.senderName;
      chats[idx].lastSenderId = msg.senderId;
      chats[idx].lastMessageAt = msg.ts;
      state.chats = chats;
      await setData('chats', chats, true);
      renderChatList();
    }
  }

  function autosizeInput(input){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  }
  function updateSendBtn(){
    const input = document.getElementById('msg-input');
    document.getElementById('send-btn').disabled = input.value.trim().length===0 && !state.pendingImage;
  }

  // ---------------- Info panel ----------------
  function toggleInfoPanel(){
    const panel = document.getElementById('info-panel');
    const isOpen = panel.style.display === 'flex';
    if(isOpen){ panel.style.display = 'none'; return; }
    renderInfoPanel();
    panel.style.display = 'flex';
  }

  function renderInfoPanel(){
    const chat = state.chats.find(c=>c.id===state.currentChatId);
    if(!chat) return;
    const panel = document.getElementById('info-panel');
    panel.style.flexDirection = 'column';
    panel.innerHTML = `
      <div id="info-panel-header">
        <h3>Chat Info</h3>
        <button id="info-panel-close">Done</button>
      </div>
      <div id="info-panel-body">
        <div class="field-label">Chat name</div>
        <input id="info-title" class="field-input" type="text" value="${escapeHtml(chat.title)}" maxlength="40">
        <div class="checkbox-row">
          <input type="checkbox" id="info-locked" ${chat.locked?'checked':''}>
          <label for="info-locked">Lock this chat with a password</label>
        </div>
        <div id="info-pw-fields" style="display:none;">
          <div class="field-label">New password</div>
          <input id="info-pw" class="field-input" type="password" maxlength="60">
          <div class="field-label">Confirm password</div>
          <input id="info-pw2" class="field-input" type="password" maxlength="60">
        </div>
        <div class="error-text" id="info-error"></div>
        <div class="modal-actions" style="justify-content:flex-start;">
          <button class="btn btn-primary" id="info-save">Save changes</button>
        </div>
        <div style="height:1px;background:var(--border);margin:18px 0;"></div>
        <button class="btn btn-danger" id="info-delete" style="width:100%;">Delete Chat</button>
        <div class="subtle-note">Passwords lock the chat behind a prompt in this app, but this isn't real encryption — treat it as a privacy convenience, not a secure vault. The same goes for direct messages: anyone signed in with the access key can still open any chat, DM or not.</div>
      </div>
    `;
    document.getElementById('info-panel-close').onclick = toggleInfoPanel;
    const lockedBox = document.getElementById('info-locked');
    const pwFields = document.getElementById('info-pw-fields');
    lockedBox.onchange = ()=>{
      pwFields.style.display = (lockedBox.checked && !chat.locked) ? 'block' : 'none';
    };
    document.getElementById('info-delete').onclick = ()=> showDeleteConfirm(chat);

    document.getElementById('info-save').onclick = async ()=>{
      const errEl = document.getElementById('info-error');
      const newTitle = document.getElementById('info-title').value.trim();
      if(!newTitle){ errEl.textContent = 'Chat name cannot be empty.'; return; }
      let newLocked = lockedBox.checked;
      let newHash = chat.passwordHash;
      if(newLocked && !chat.locked){
        const pw = document.getElementById('info-pw').value;
        const pw2 = document.getElementById('info-pw2').value;
        if(pw.length < 4){ errEl.textContent = 'Password must be at least 4 characters.'; return; }
        if(pw !== pw2){ errEl.textContent = 'Passwords do not match.'; return; }
        newHash = await hashPassword(pw);
        state.unlockedChatIds.add(chat.id);
      }
      if(!newLocked){ newHash = null; }
      chat.title = newTitle;
      chat.locked = newLocked;
      chat.passwordHash = newHash;
      const fresh = await getDataOrKeep('chats', true);
      const baseChats = fresh.changed ? fresh.value : state.chats;
      const idx = baseChats.findIndex(c=>c.id===chat.id);
      if(idx>-1) baseChats[idx] = chat; else baseChats.unshift(chat);
      state.chats = baseChats;
      const ok = await setData('chats', state.chats, true);
      renderChatList();
      renderConvHeader();
      toggleInfoPanel();
      if(!ok) showToast("Changes saved locally, but couldn't confirm they synced.");
    };
  }

  // ---------------- Search ----------------
  document.getElementById('search-input').addEventListener('input', e=>{
    state.searchTerm = e.target.value;
    renderChatList();
  });

  // ---------------- Typing indicator ----------------
  const typingUsers = new Map(); // senderId -> {name, timeoutId}
  let lastTypingSentAt = 0;

  function clearTypingUsers(){
    typingUsers.forEach(u => clearTimeout(u.timeoutId));
    typingUsers.clear();
  }

  function renderTypingBubble(){
    const el = document.getElementById('messages-scroll');
    if(!el) return;
    let bubble = document.getElementById('typing-bubble-row');
    if(typingUsers.size === 0){
      if(bubble) bubble.remove();
      return;
    }
    const entries = Array.from(typingUsers.entries());
    const names = entries.map(([,u])=>u.name);
    let label;
    if(names.length === 1) label = names[0] + ' is typing';
    else if(names.length === 2) label = names[0] + ' and ' + names[1] + ' are typing';
    else label = names.slice(0,-1).join(', ') + ', and ' + names[names.length-1] + ' are typing';
    const wasNearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
    if(!bubble){
      bubble = document.createElement('div');
      bubble.id = 'typing-bubble-row';
      bubble.className = 'msg-row them';
    }
    const prof = state.profilesCache[entries[0][0]];
    bubble.innerHTML = `
      <div class="msg-avatar">${avatarHtml(prof, names[0], entries[0][0])}</div>
      <div class="bubble-group">
        <div class="sender-label">${escapeHtml(label)}</div>
        <div class="bubble typing-bubble"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>
      </div>
    `;
    el.appendChild(bubble);
    if(wasNearBottom) el.scrollTop = el.scrollHeight;
  }

  function sendTypingSignal(){
    if(!state.currentChatId || !state.profile) return;
    const now = Date.now();
    if(now - lastTypingSentAt < 1500) return;
    lastTypingSentAt = now;
    if(ws && ws.readyState === WebSocket.OPEN){
      try{
        ws.send(JSON.stringify({
          type:'typing',
          chatId: state.currentChatId,
          senderId: state.profile.id,
          senderName: state.profile.name
        }));
      }catch(e){}
    }
  }

  // ---------------- Composer events ----------------
  const msgInput = document.getElementById('msg-input');
  msgInput.addEventListener('input', ()=>{ autosizeInput(msgInput); updateSendBtn(); sendTypingSignal(); });
  msgInput.addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });
  document.getElementById('send-btn').onclick = sendMessage;
  document.getElementById('compose-btn').onclick = showNewChatModal;
  document.getElementById('settings-btn').onclick = showSettingsModal;
  document.getElementById('info-btn').onclick = toggleInfoPanel;
  document.getElementById('back-btn').onclick = ()=>{
    document.getElementById('sidebar').classList.remove('hidden');
    document.getElementById('main').classList.add('hidden');
  };

  // ---------------- Connection status + WebSocket ----------------
  function setConnStatus(status){
    const dot = document.getElementById('conn-dot');
    if(!dot) return;
    dot.classList.remove('conn-connecting','conn-connected','conn-disconnected');
    dot.classList.add('conn-'+status);
    dot.title = status === 'connected' ? 'Connected'
      : status === 'connecting' ? 'Connecting…'
      : 'Disconnected — retrying';
  }

  let ws = null;
  let wsReconnectDelay = 1000;
  const WS_MAX_DELAY = 15000;
  let wsReconnectTimer = null;

  function connectWS(){
    setConnStatus('connecting');
    try{
      ws = new WebSocket(WS_BASE_URL + '?key=' + encodeURIComponent(SITE_KEY_VALUE || ''));
    }catch(e){
      scheduleReconnect();
      return;
    }
    ws.onopen = ()=>{
      setConnStatus('connected');
      wsReconnectDelay = 1000;
      sendIdentify();
      syncAll();
    };
    ws.onmessage = (evt)=>{
      let msg;
      try{ msg = JSON.parse(evt.data); }catch(e){ return; }
      handleWsMessage(msg);
    };
    ws.onclose = (evt)=>{
      setConnStatus('disconnected');
      state.onlineUsers = [];
      updateOnlineCountUI();
      if(evt && evt.code === 4001){
        handleUnauthorized();
        return; // don't keep retrying with a bad key
      }
      scheduleReconnect();
    };
    ws.onerror = ()=>{
      try{ ws.close(); }catch(e){}
    };
  }

  function scheduleReconnect(){
    if(wsReconnectTimer) return;
    wsReconnectTimer = setTimeout(()=>{
      wsReconnectTimer = null;
      connectWS();
    }, wsReconnectDelay);
    wsReconnectDelay = Math.min(wsReconnectDelay * 1.6, WS_MAX_DELAY);
  }

  function handleWsMessage(msg){
    if(!msg || typeof msg.type !== 'string') return;

    if(msg.type === 'hello' || msg.type === 'presence'){
      if(Array.isArray(msg.online)){
        state.onlineUsers = msg.online;
        updateOnlineCountUI();
        if(msg.type === 'presence'){
          renderChatList();
          if(state.currentChatId) renderMessages(state.currentChatId);
        }
      }
      return;
    }

    if(msg.type === 'typing'){
      if(!state.profile || msg.senderId === state.profile.id) return;
      if(msg.chatId !== state.currentChatId) return;
      const existing = typingUsers.get(msg.senderId);
      if(existing) clearTimeout(existing.timeoutId);
      const timeoutId = setTimeout(()=>{
        typingUsers.delete(msg.senderId);
        renderTypingBubble();
      }, 3000);
      typingUsers.set(msg.senderId, {name: msg.senderName || 'Someone', timeoutId});
      renderTypingBubble();
      return;
    }

    if(msg.type !== 'update' || typeof msg.key !== 'string') return;
    if(msg.key === 'chats'){
      if(Array.isArray(msg.value)){
        state.chats = msg.value;
        renderChatList();
        if(state.currentChatId){
          if(state.chats.find(c=>c.id===state.currentChatId)){
            renderConvHeader();
          }else{
            state.currentChatId = null;
            clearTypingUsers();
            showNoChatSelected();
          }
        }
      }
    }else if(msg.key.indexOf('messages:')===0){
      const chatId = msg.key.slice('messages:'.length);
      if(Array.isArray(msg.value)){
        const prevMsgs = state.messagesCache[chatId] || [];
        const prevIds = new Set(prevMsgs.map(m=>m.id));
        const newOnes = msg.value.filter(m => !prevIds.has(m.id));
        state.messagesCache[chatId] = msg.value;
        if(chatId === state.currentChatId) renderMessages(chatId);
        const isActivelyViewing = chatId === state.currentChatId && document.visibilityState === 'visible';
        if(!isActivelyViewing){
          const fromOthers = newOnes.filter(m => !state.profile || m.senderId !== state.profile.id);
          if(fromOthers.length){
            state.unreadCounts[chatId] = (state.unreadCounts[chatId] || 0) + fromOthers.length;
            updateUnreadUI();
            renderChatList();
          }
        }
      }
    }else if(msg.key.indexOf('profiles:')===0){
      const uid = msg.key.slice('profiles:'.length);
      state.profilesCache[uid] = msg.value;
      renderChatList();
      if(state.currentChatId) renderMessages(state.currentChatId);
    }
  }

  async function syncAll(){
    await ensureProfileSynced();
    const chatsRes = await getDataOrKeep('chats', true);
    if(chatsRes.changed){
      state.chats = chatsRes.value;
      renderChatList();
    }
    if(state.currentChatId){
      const stillExists = state.chats.find(c=>c.id===state.currentChatId);
      if(stillExists){
        const msgsRes = await getDataOrKeep('messages:'+state.currentChatId, true);
        if(msgsRes.changed){
          state.messagesCache[state.currentChatId] = msgsRes.value;
          renderMessages(state.currentChatId);
        }
      }else if(chatsRes.changed){
        state.currentChatId = null;
        clearTypingUsers();
        showNoChatSelected();
      }
    }
  }
  setInterval(syncAll, 20000);

  // ---------------- Init ----------------
  async function init(){
    if(!state.profile){
      const profile = await getData('profile', false, null);
      if(!profile){
        showNamePrompt();
        return;
      }
      state.profile = profile;
    }
    sendIdentify();
    state.chats = await getData('chats', true, []);
    renderChatList();
    updateSendBtn();
    updateUnreadUI();
    if(window.innerWidth <= 680){
      document.getElementById('main').classList.add('hidden');
    }
  }

  // ---------------- Access gate ----------------
  function boot(){
    init();
    connectWS();
  }

  function unlockApp(){
    document.getElementById('gate-screen').style.display = 'none';
    boot();
  }

  function showGate(){
    const screen = document.getElementById('gate-screen');
    screen.style.display = 'flex';
    const input = document.getElementById('gate-key-input');
    const submitBtn = document.getElementById('gate-submit');
    input.focus();
    const attempt = async ()=>{
      const val = input.value;
      if(!val) return;
      submitBtn.disabled = true;
      document.getElementById('gate-error').textContent = '';
      const ok = await verifyKeyWithServer(val);
      submitBtn.disabled = false;
      if(ok){
        SITE_KEY_VALUE = val;
        try{ localStorage.setItem(GATE_KEY_STORAGE, val); }catch(e){}
        unlockApp();
      }else{
        document.getElementById('gate-error').textContent = 'Incorrect key, or the server is unreachable — try again.';
        input.value = '';
        input.focus();
      }
    };
    submitBtn.onclick = attempt;
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') attempt(); });
  }

  (async function(){
    const stored = getStoredSiteKey();
    if(stored){
      const ok = await verifyKeyWithServer(stored);
      if(ok){
        SITE_KEY_VALUE = stored;
        unlockApp();
        return;
      }
      try{ localStorage.removeItem(GATE_KEY_STORAGE); }catch(e){}
    }
    showGate();
  })();

})();
</script>
</body>
</html>
