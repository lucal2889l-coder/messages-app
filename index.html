<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e1f22">
<meta name="description" content="A private chat app — groups, DMs, file sharing and notifications.">
<title>Messages</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
<script>
  // Apply the saved theme before first paint so there's no flash.
  try {
    var p = JSON.parse(localStorage.getItem('prefs') || '{}');
    document.documentElement.setAttribute('data-theme', p.theme || localStorage.getItem('theme') || 'dark');
    if (p.accent) document.documentElement.style.setProperty('--accent', p.accent);
    if (p.fontSize) document.documentElement.style.setProperty('--fs', p.fontSize + 'px');
  } catch (e) {}
</script>
</head>
<body>

<!-- Loading -->
<div id="boot-screen" class="screen">
  <div class="auth-card" style="background:transparent;box-shadow:none">
    <img class="auth-logo" src="icon.svg" alt="">
    <div id="boot-msg" style="color:var(--muted)">Starting Messages…</div>
    <div class="boot-spinner" id="boot-spinner"></div>
    <div id="boot-actions" style="margin-top:16px"></div>
  </div>
</div>

<!-- Site access key -->
<div id="gate-screen" class="screen hidden">
  <form class="auth-card" id="gate-form" autocomplete="off">
    <img class="auth-logo" src="icon.svg" alt="">
    <h1>Welcome back!</h1>
    <p>This app is private. Enter the access key to continue.</p>
    <div class="field">
      <label class="label" for="gate-key">Access key <span class="req">*</span></label>
      <input id="gate-key" class="input" type="password" autocomplete="off" required>
      <div class="error" id="gate-error"></div>
    </div>
    <button class="btn block" id="gate-submit" type="submit">Continue</button>
  </form>
</div>

<!-- Pick a name / sign in with a login code -->
<div id="onboard-screen" class="screen hidden">
  <form class="auth-card" id="onboard-form" autocomplete="off"></form>
</div>

<div id="app" class="hidden">
  <nav id="rail" class="scroller" aria-label="Groups"></nav>
  <aside id="sidebar">
    <div id="sidebar-header"></div>
    <div id="sidebar-body" class="scroller thin"></div>
    <div id="user-panel"></div>
  </aside>
  <main id="main">
    <div id="notif-banner" class="hidden"></div>
    <header id="main-header"></header>
    <div id="main-body">
      <section id="center"></section>
      <aside id="right-panel" class="scroller thin hidden"></aside>
    </div>
  </main>
  <div id="nav-scrim"></div>
</div>

<div id="layer"></div>
<div id="modal-root"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<input type="file" id="file-input" multiple hidden>
<input type="file" id="folder-input" webkitdirectory directory multiple hidden>
<input type="file" id="image-input" accept="image/png,image/jpeg,image/gif,image/webp" hidden>

<script type="module" src="js/app.js"></script>
</body>
</html>
