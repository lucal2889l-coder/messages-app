# Render Blueprint for the Messages chat server
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in Render choose
# "New +" -> "Blueprint" and point it at the repo.

services:
  - type: web
    name: messages-server
    runtime: node
    plan: free
    region: oregon        # also available: frankfurt, singapore, ohio, virginia
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"

    # No disk is attached on this plan, so data.json (and all chats/
    # messages in it) is wiped on every deploy, restart, or idle-
    # spindown. That's expected and fine for this app's current use.
